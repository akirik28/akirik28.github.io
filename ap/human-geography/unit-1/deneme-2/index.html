<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<script src="/ap/_kit/hesap.js?v=8"></script><script src="/kitpath/kapi.js?v=4"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Deneme 2 · Unit 1 · zor ve süreli</title>
<style>
:root{--blue:#324DC7;--blue-d:#2A3FA8;--ink:#1E1E1E;--bar:#E6EDF8;--line:#B2B2B2;--red:#C13145;--ok:#177A46;--bad:#B3261E;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:"Noto Serif",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
.dash{height:3px;background:repeating-linear-gradient(90deg,#1E1E1E 0 28px,transparent 28px 34px,#324DC7 34px 62px,transparent 62px 68px,#F2B705 68px 96px,transparent 96px 102px,#C13145 102px 130px,transparent 130px 136px,#1F8A70 136px 164px,transparent 164px 170px)}
.top{position:sticky;top:0;z-index:20;background:var(--bar)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 28px;min-height:74px}
.tl b{display:block;font-size:17px;line-height:1.25}
.tl .sub{font-size:13px;color:#4a4a4a}
.tc{text-align:center}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;min-height:28px}
.timer.warn{color:var(--red)}
.pill{margin-top:2px;border:1px solid #333;background:transparent;border-radius:999px;padding:1px 12px;font-size:12px;font-weight:600}
.pill:hover{background:#fff}
.tr{display:flex;justify-content:flex-end;gap:10px}
.tool{border:0;background:transparent;font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.tool:hover{background:#fff}
.main{max-width:780px;margin:0 auto;padding:30px 22px 140px}
.qh{display:flex;align-items:center;gap:12px;background:#F0F0F0;border-bottom:2px dashed #333}
.qn{background:#1E1E1E;color:#fff;font-weight:700;min-width:32px;height:34px;display:grid;place-items:center;padding:0 8px}
.mark{display:flex;align-items:center;gap:6px;border:0;background:transparent;font-size:14px;padding:6px 4px}
.mark svg{width:16px;height:18px;fill:none;stroke:#1E1E1E;stroke-width:1.8}
.mark.on svg{fill:var(--red);stroke:var(--red)}
.mark.on{font-weight:700}
.abc{margin-left:auto;margin-right:8px;border:1.5px solid #333;border-radius:6px;background:#fff;font-size:12px;font-weight:700;padding:3px 7px;text-decoration:line-through}
.abc.on{background:var(--blue);border-color:var(--blue);color:#fff}
.qt{font-family:var(--serif);font-size:18.5px;line-height:1.6;margin:22px 0 20px}
.orow{display:flex;align-items:center;gap:12px;margin:12px 0}
.opt{position:relative;flex:1;display:flex;align-items:flex-start;gap:14px;text-align:left;background:#fff;border:1px solid #333;border-radius:10px;padding:13px 16px;font-family:var(--serif);font-size:17.5px;line-height:1.45}
.opt:hover{background:#F6F8FD}
.ltr{flex:none;width:28px;height:28px;border:1.5px solid #333;border-radius:50%;display:grid;place-items:center;font-family:var(--ui);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.opt.sel .ltr{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.x{color:#777;border-color:#999}
.opt.x .ltr{border-color:#999}
.opt.x::after{content:"";position:absolute;left:-7px;right:-7px;top:50%;border-top:2px solid #1E1E1E}
.xb{flex:none;width:46px;height:30px;border:0;background:transparent;font-size:12.5px;font-weight:700;text-decoration:underline;padding:0}
.xb .xl{display:inline-grid;place-items:center;width:24px;height:24px;border:1.5px solid #333;border-radius:50%;text-decoration:line-through;font-size:12px}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar)}
.bot-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 28px}
.who{font-size:16px;font-weight:600}
.navpill{border:0;background:#1E1E1E;color:#fff;border-radius:8px;padding:9px 16px;font-weight:700;font-size:15px}
.navpill .chev{display:inline-block;margin-left:6px;font-size:11px}
.nb{display:flex;justify-content:flex-end;gap:10px}
.btn{border:1.5px solid var(--blue);background:var(--blue);color:#fff;border-radius:999px;padding:9px 26px;font-weight:700;font-size:15px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.ghost:hover{background:#EEF2FF}
.btn[disabled]{opacity:.35;cursor:default}
.pop{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:30;width:min(560px,94vw);background:#fff;border:1px solid #999;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:18px 20px 20px}
.pop::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:#fff;border-right:1px solid #999;border-bottom:1px solid #999;transform:translateX(-50%) rotate(45deg)}
.ph{display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;padding-bottom:12px;border-bottom:1px solid #ccc}
.ph .x{position:absolute;right:0;top:-4px;border:0;background:transparent;font-size:24px;line-height:1}
.lg{display:flex;justify-content:center;gap:20px;font-size:13px;padding:12px 0;border-bottom:1px solid #ccc;flex-wrap:wrap}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block}
.lg .pin{width:10px;height:10px;border-radius:50% 50% 50% 0;background:#1E1E1E;transform:rotate(-45deg)}
.lg .dsh{width:16px;height:16px;border:1.5px dashed #333}
.lg .flag{width:10px;height:13px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:16px 10px;padding:22px 4px 20px}
.gq{position:relative;height:36px;border:1.5px dashed #333;background:#fff;color:var(--blue);font-weight:700;font-size:15px;border-radius:2px}
.gq.ans{border:1.5px solid var(--blue);background:var(--blue);color:#fff}
.gq.cur::before{content:"";position:absolute;left:50%;top:-13px;width:10px;height:10px;margin-left:-5px;border-radius:50% 50% 50% 0;background:#1E1E1E;transform:rotate(-45deg)}
.gq.mk::after{content:"";position:absolute;right:-5px;top:-6px;width:10px;height:13px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.pc{text-align:center}
.card{border:1px solid #ccc;border-radius:14px;padding:22px 24px;margin:18px 0;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.06)}
h1{font-size:30px;margin:8px 0 6px}
h2{font-size:20px;margin:26px 0 8px}
.lead{font-size:16.5px;line-height:1.55;color:#333}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.facts div{background:var(--bar);border-radius:12px;padding:14px 16px}
.facts b{display:block;font-size:24px}
.facts span{font-size:13px;color:#444}
ul.how{padding-left:20px;line-height:1.6;font-size:15.5px}
.names{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.names button{border:1.5px solid #333;background:#fff;border-radius:999px;padding:6px 16px;font-weight:600}
.names button.on{background:#1E1E1E;color:#fff}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-size:56px;line-height:1}
.score span{font-size:18px;color:#444}
.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb td{padding:7px 4px;border-bottom:1px solid #e3e3e3}
.tb td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:8px;background:#e6e6e6;border-radius:99px;overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--blue)}
.seg{display:inline-flex;border:1.5px solid #333;border-radius:999px;overflow:hidden;margin:6px 0 4px}
.seg button{border:0;background:#fff;padding:6px 16px;font-weight:600;font-size:14px}
.seg button.on{background:#1E1E1E;color:#fff}
.rv{border:1px solid #ccc;border-radius:12px;padding:16px 18px;margin:14px 0}
.rv .rh{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;margin-bottom:8px}
.badge{border-radius:999px;padding:2px 10px;color:#fff;font-size:12px}
.badge.ok{background:var(--ok)}.badge.no{background:var(--bad)}.badge.em{background:#666}
.rv .rq{font-family:var(--serif);font-size:16.5px;line-height:1.5;margin:0 0 10px}
.ro{display:flex;gap:10px;align-items:flex-start;font-family:var(--serif);font-size:15.5px;line-height:1.4;padding:6px 10px;border-radius:8px;margin:3px 0}
.ro b{font-family:var(--ui);font-size:13px;min-width:16px}
.ro.c{background:#E3F4EA;outline:1.5px solid var(--ok)}
.ro.w{background:#FBE9E7;outline:1.5px solid var(--bad)}
.ro .tag{margin-left:auto;font-family:var(--ui);font-size:11.5px;font-weight:700;white-space:nowrap;padding-left:8px}
.why{margin:10px 0 0;padding:10px 12px;background:#F4F6FB;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;font-size:15px;line-height:1.55}
.term{font-style:italic;font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:40;background:#1E1E1E;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
@media (max-width:640px){
  .top-in{grid-template-columns:1fr auto;padding:8px 14px;min-height:0}
  .tl .sub,.tr{display:none}
  .tl b{font-size:14px}
  .bot-in{grid-template-columns:auto 1fr;padding:10px 12px;gap:8px}
  .who{display:none}
  .btn{padding:9px 18px}
  .navpill{padding:9px 10px;font-size:13.5px}
  .grid{grid-template-columns:repeat(6,1fr)}
  .facts{grid-template-columns:1fr}
  .qt{font-size:17px}.opt{font-size:16px}
  .main{padding:18px 14px 130px}
}
</style>
</head>
<body>

<script src="/ap/_kit/hesap.js?v=8"></script>
<script>
(function () {
  "use strict";
  var MIN = 30;
  /* t: konu · q: soru · o: şıklar · a: doğru şık (0=A) · w: açıklama (*yıldız* = İngilizce terim) */
  var Q = [
    { t: "Ölçek",
      q: "Two maps are printed on sheets of the same size. Map 1 has a scale of 1:24,000 and Map 2 has a scale of 1:1,000,000. Which of the following statements is accurate?",
      o: ["Map 2 is the larger-scale map because its scale contains the larger number.",
          "Map 1 shows a larger portion of Earth's surface than Map 2 does.",
          "Map 1 is the larger-scale map and shows a smaller area in greater detail.",
          "Both maps show the same amount of detail because the sheets are the same size.",
          "Map 2 would be the better choice for showing individual buildings and streets."],
      a: 2,
      w: "1:24.000 kesri 1:1.000.000'dan büyüktür; yani Map 1 *large scale*'dir: küçük alan, çok ayrıntı. Tuzak: paydadaki sayı büyüdükçe ölçek küçülür." },
    { t: "Yayılma",
      q: "A fashion trend first appears among designers in Paris, Milan, and New York, then in other large cities around the world, and only later in small towns located near Paris. Which type of diffusion does this sequence best illustrate?",
      o: ["Contagious diffusion", "Relocation diffusion", "Stimulus diffusion", "Reverse hierarchical diffusion", "Hierarchical diffusion"],
      a: 4,
      w: "Önce büyük moda merkezleri, sonra diğer büyük şehirler, en son yakındaki küçük kasabalar: yayılma mesafeye göre değil, şehirlerin önem sırasına göre ilerliyor. Bu *hierarchical diffusion*. *Contagious* olsaydı önce Paris'in yanındaki kasabalara ulaşırdı." },
    { t: "Konum",
      q: "Singapore is a small, low-lying island with a deep natural harbor. Geographers, however, usually explain its rise as one of the world's busiest ports by pointing to its position on the Strait of Malacca, the main shipping route between the Indian Ocean and the South China Sea. The second explanation emphasizes Singapore's",
      o: ["situation", "site", "absolute location", "toponym", "cultural landscape"],
      a: 0,
      w: "Doğal liman ve ada oluşu *site* özelliğidir; ama soru ikinci açıklamayı soruyor: Singapur'un ticaret yoluna göre konumu. Başka yerlere göre konum = *situation*." },
    { t: "Harita türleri",
      q: "A choropleth map shades each state according to its total number of flu cases. A critic argues that the map is misleading. Which of the following is the strongest basis for the criticism?",
      o: ["Choropleth maps cannot be used to display quantitative data.",
          "Flu cases are point data and can be shown only with isolines.",
          "Totals largely reflect how many people live in each state, so the data should be mapped as a rate.",
          "Choropleth maps distort the shapes of the states.",
          "The map should have been drawn at a larger map scale."],
      a: 2,
      w: "Toplam vaka sayısı en çok kalabalık eyaletlerde çıkar; harita hastalığı değil nüfusu göstermiş olur. *Choropleth* haritada oran (100.000 kişi başına vaka gibi) kullanılmalıdır." },
    { t: "Mesafe ve etkileşim",
      q: "For decades, a factory town imported coal from a mine 900 kilometers away. After a new mine opened only 150 kilometers away, shipments from the distant mine stopped, even though that mine still produced coal at the same price. Which concept best explains the change?",
      o: ["Complementarity", "Intervening opportunity", "Transferability", "Time-space compression", "Stimulus diffusion"],
      a: 1,
      w: "İki yer arasındaki arz-talep (*complementarity*) sürüyor, fiyat da aynı. Değişen tek şey araya daha yakın bir kaynağın girmesi: *intervening opportunity*." },
    { t: "Projeksiyonlar",
      q: "A navigator wants to plot a course of constant compass bearing as a straight line on a map. Which projection should the navigator use, and what is its main disadvantage?",
      o: ["Robinson; it distorts direction near the equator",
          "Mercator; it greatly exaggerates the size of areas at high latitudes",
          "Gall-Peters; it distorts the shapes of landmasses",
          "Goode homolosine; it interrupts the oceans",
          "Azimuthal; it shows only one hemisphere accurately"],
      a: 1,
      w: "*Mercator*'da sabit pusula yönü düz çizgidir, bu yüzden denizcilikte kullanılır. Bedeli: kutuplara yaklaştıkça alanlar aşırı büyür (Grönland, Afrika kadar görünür)." },
    { t: "Bölgeler",
      q: "A geographer maps (1) the area in which more than half of households speak French at home, (2) the area served by a city's commuter rail network, and (3) the area that residents describe as “the South.” In order, these are examples of which types of regions?",
      o: ["Functional, formal, perceptual", "Perceptual, functional, formal", "Formal, functional, perceptual", "Formal, perceptual, functional", "Functional, perceptual, formal"],
      a: 2,
      w: "Ortak bir özelliğin (dil) baskın olduğu alan *formal*; bir merkeze bağlanan ağın (banliyö treni) hizmet alanı *functional*; insanların zihnindeki “the South” ise *perceptual (vernacular)* region." },
    { t: "Temel kavramlar",
      q: "Which of the following statements would an environmental determinist be most likely to make?",
      o: ["“Societies in similar climates often choose very different ways of farming.”",
          "“Technology allows people to overcome many of the limits of their environment.”",
          "“The environment offers a range of options, and culture decides among them.”",
          "“Temperate climates produce more industrious and inventive societies than tropical climates do.”",
          "“Human activity is the main force that reshapes natural landscapes.”"],
      a: 3,
      w: "*Environmental determinism* iklimin ve doğanın toplumun karakterini ve başarısını belirlediğini savunur (D). A, B ve C *possibilism*'dir: çevre seçenek sunar, insan seçer. E ise insanın doğayı biçimlendirmesini anlatır." },
    { t: "Dağılım",
      q: "A county's population doubles over twenty years, and all of the new residents move into a single new suburb in one corner of the county. The county's boundaries do not change. Which of the following describes the change in the county's population distribution?",
      o: ["Density stayed the same, and the distribution became more dispersed.",
          "Density increased, and the distribution became more clustered.",
          "Density decreased, and the pattern became linear.",
          "Density increased, and the distribution became more dispersed.",
          "Neither density nor concentration changed, because the area is the same."],
      a: 1,
      w: "Alan aynı, nüfus iki katına çıktı: *density* arttı. Yeni gelenlerin hepsi tek bir köşeye yerleşti: dağılım daha *clustered* (kümelenmiş) oldu. *Density* ile *concentration* ayrı şeylerdir." },
    { t: "Coğrafi araçlar",
      q: "After a hurricane, an agency (1) acquires satellite images of the flooded coast, (2) sends workers whose handheld receivers record the precise coordinates of damaged bridges, and (3) overlays both data sets on a road map to plan repair routes. In order, the three steps rely on",
      o: ["GIS, GPS, remote sensing", "GPS, remote sensing, GIS", "remote sensing, GPS, GIS", "remote sensing, GIS, GPS", "GPS, GIS, remote sensing"],
      a: 2,
      w: "Uydu görüntüsü = *remote sensing* (uzaktan veri toplama). El cihazıyla koordinat almak = *GPS*. Katmanları üst üste bindirip analiz etmek = *GIS*." },
    { t: "Mesafe ve etkileşim",
      q: "In the gravity model, interaction between two places is proportional to the product of their populations divided by the square of the distance between them. City A (population 2 million) and City B (population 1 million) are 100 kilometers apart. Which change would reduce their predicted interaction to one-fourth of its original value?",
      o: ["Halving the population of City A",
          "Halving the population of both cities and halving the distance between them",
          "Doubling the population of City B",
          "Reducing the distance between them to 50 kilometers",
          "Increasing the distance between them to 200 kilometers"],
      a: 4,
      w: "Etkileşim mesafenin karesiyle ters orantılıdır: mesafe 2 katına çıkınca etkileşim 1/4'e düşer. A yalnızca yarıya indirir; B'de iki etki birbirini götürür; C ve D etkileşimi artırır." },
    { t: "Yayılma",
      q: "A discount retailer was founded in a small town in rural Arkansas, expanded first to other small towns, and reached large metropolitan areas only decades later. This pattern is best described as",
      o: ["hierarchical diffusion", "reverse hierarchical diffusion", "stimulus diffusion", "relocation diffusion", "time-space compression"],
      a: 1,
      w: "Küçük kasabadan başlayıp sonradan büyük şehirlere çıkmak hiyerarşinin tersidir: *reverse hierarchical diffusion*. Normal *hierarchical diffusion* büyükten küçüğe iner." },
    { t: "Ölçek",
      q: "At the national scale, Country Z has one of the highest average incomes in its region. A map of the same data at the provincial scale shows that two provinces are very wealthy and the other eight are poor. The comparison best illustrates which of the following?",
      o: ["Data mapped at the national scale are more accurate than data mapped at the provincial scale.",
          "The national map uses a projection that distorts the area of the poorer provinces.",
          "Provincial boundaries are an example of a perceptual region.",
          "Income is qualitative data and cannot be compared across scales.",
          "A pattern seen at one scale of analysis can hide variation that is visible at another scale."],
      a: 4,
      w: "*Scale of analysis* değişince görünen desen de değişir: ülke ortalaması, eyaletler arasındaki eşitsizliği gizler. Veri aynı; yalnızca toplandığı düzey farklı." },
    { t: "Harita türleri",
      q: "On an isoline map of elevation, the lines in one part of the map are spaced very close together. This indicates that in that area",
      o: ["elevation changes rapidly over a short distance", "elevation is the highest on the map", "the land is nearly flat", "no data were collected", "the map scale is smaller than elsewhere on the map"],
      a: 0,
      w: "*Isoline* haritada çizgiler eşit değerleri birleştirir. Çizgiler sıklaşıyorsa değer kısa mesafede hızla değişiyordur: dik yamaç. Seyrek çizgi = düzlük." },
    { t: "Konum",
      q: "A live event begins in London (0° longitude) at 6:00 p.m. local time. Ignoring political adjustments to time zones, what is the local time at a location at 75° W longitude?",
      o: ["1:00 p.m.", "11:00 p.m.", "6:00 p.m.", "11:00 a.m.", "5:00 p.m."],
      a: 0,
      w: "Her 15° boylam = 1 saat. 75 ÷ 15 = 5 saat. Batıya gidildikçe saat geri gelir: 18.00 − 5 = 13.00, yani 1:00 p.m. B şıkkı yönü ters alanların cevabıdır." },
    { t: "Temel kavramlar",
      q: "A researcher studies how farmers in the Andes reshape steep slopes with terraces and how those terraces in turn affect erosion. Within Pattison's four traditions of geography, this research fits best in the",
      o: ["earth-science tradition", "locational (spatial) tradition", "area-analysis (regional) tradition", "culture-environment (man-land) tradition", "cartographic tradition"],
      a: 3,
      w: "İnsanın çevreyi değiştirmesi ve çevrenin insanı etkilemesi = *culture-environment (man-land) tradition*. E'deki “cartographic” Pattison'ın dört geleneğinden biri değildir (earth-science, culture-environment, locational, area-analysis)." },
    { t: "Projeksiyonlar",
      q: "Which of the following statements about map projections is accurate?",
      o: ["The Robinson projection preserves area, shape, distance, and direction perfectly.",
          "The Gall-Peters projection preserves the shapes of continents but distorts their relative sizes.",
          "The Mercator projection is an equal-area projection.",
          "The Robinson projection preserves no single property perfectly but keeps every type of distortion relatively low.",
          "An azimuthal projection shows true direction from every point on the map."],
      a: 3,
      w: "*Robinson* bir uzlaşma projeksiyonudur: hiçbir özelliği tam korumaz ama hepsini az bozar. *Gall-Peters* alanı korur, şekli bozar (B tersini söylüyor). *Mercator* equal-area değildir. *Azimuthal* haritada doğru yön yalnızca merkez noktadan geçerlidir." },
    { t: "Dağılım",

})();
</script>
