<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cep Kitleri</title>
<meta name="description" content="Tek bir sınav ya da tek bir konu için hazırlanmış küçük çalışma paketleri: videolar, kanıt listeleri, provalar ve süreli denemeler.">
<meta name="theme-color" content="#0B0B0C">
<link rel="canonical" href="https://akirik28.github.io/cep/">
<meta property="og:type" content="website">
<meta property="og:title" content="Cep Kitleri">
<meta property="og:description" content="Küçük, tek işe odaklı çalışma paketleri.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/archivo-normal-100-900-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{color-scheme:dark;--bg:#0B0B0C;--bg-2:#141416;--surface:#161618;--ink:#F3F1EC;--ink-2:#CDCAC3;--muted:#8E8C95;--line:#26262A;--line-2:#35353B;--accent:#E9B949;
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;--serif:"Instrument Serif",Georgia,"Times New Roman",serif;--mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ul{list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.wrap{position:relative;z-index:1;width:100%;max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.glow{position:fixed;z-index:0;inset:0 0 auto 0;height:76vh;pointer-events:none;background:radial-gradient(64% 88% at 86% -12%,color-mix(in oklab,var(--accent) 14%,transparent),transparent 70%)}
.top{display:flex;align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--muted);font-size:14.5px;font-weight:550}
.back:hover{color:var(--ink)}
.hero{display:grid;gap:22px;padding:clamp(26px,5.4vw,64px) 0 clamp(20px,3vw,32px)}
.eyebrow{color:var(--muted)}
.hero h1{font-size:clamp(44px,7.4vw,96px);font-weight:760;letter-spacing:-.05em;line-height:.96;text-wrap:balance}
.hero h1 em{color:var(--accent);font-size:1.06em;letter-spacing:-.02em;padding-right:.04em}
.lead{font-size:clamp(17px,1.5vw,20px);line-height:1.55;color:var(--ink-2);max-width:640px;text-wrap:pretty}

.need{display:grid;gap:12px;padding:20px 0 26px;border-top:1px solid var(--line)}
.need p{color:var(--muted)}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mode{min-height:44px;padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-weight:600;font-size:15px;cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
.mode:hover{border-color:var(--ink-2)}
.mode[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;padding-bottom:20px}
.pack{display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px;border-radius:26px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);transition:opacity .25s,border-color .2s}
.pack.off{opacity:.32}
.pack-h{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--c)}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pack h2{font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.pack h2 span{display:block;margin-top:6px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:19px;letter-spacing:-.005em;color:var(--ink-2)}
.items{display:grid;gap:8px;align-content:start}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;min-height:56px;padding:10px 14px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line);transition:opacity .25s,border-color .2s,transform .25s var(--ease)}
a.item:hover{border-color:var(--c);transform:translateX(3px)}
a.item:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.item b{font-weight:650;font-size:15.5px;line-height:1.25}
.item small{grid-column:1;font-size:13px;color:var(--muted);line-height:1.35}
.item i{grid-row:1/span 2;grid-column:2;font-style:normal;color:var(--c)}
.item.off{opacity:.3}
.pack-f{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
.open{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;font-weight:650;font-size:14.5px;color:var(--ink)}
.open:hover{color:var(--c)}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding-top:26px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 34px);margin-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.foot a:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="top wrap">
  <a class="back" href="/"><span aria-hidden="true">←</span> Ana sayfa</a>
</header>

<main class="wrap">
  <section class="hero" aria-labelledby="baslik">
    <p class="eyebrow mono">Çalışma paketleri</p>
    <h1 id="baslik">Cep <em class="serif">Kitleri</em></h1>
    <p class="lead">Her paket tek bir sınav ya da tek bir konu için hazır. İçinde ne varsa sırayla aç; ne kadar vaktin olduğuna göre aşağıdan seç.</p>
  </section>

  <section class="need" aria-label="Ne lazım?">
    <p class="mono">Ne lazım?</p>
    <div class="modes" id="modes"></div>
  </section>

  <ul class="packs" id="packs"></ul>
  <noscript><p class="lead"><a href="/crucible/" style="text-decoration:underline">Crucible savunma paketi →</a> · <a href="/ap/" style="text-decoration:underline">AP kitleri →</a></p></noscript>
</main>

<footer class="foot wrap">
  <p>İlerleme her cihazda ayrı saklanır.</p>
  <a href="/ap/">Bütün AP üniteleri →</a>
</footer>

<script>
/* ==========================================================================
   CEP KİTLERİ — paketler buradan yönetilir.
   Yeni paket için PAKETLER dizisine bir nesne ekle.
   Her içerik satırının "mod" listesi, üstteki "Ne lazım?" seçimlerinden
   hangisinde öne çıkacağını belirler: ogren · tekrar · test
   ========================================================================== */
var MODLAR = [
  { id: "hepsi",  ad: "Hepsi" },
  { id: "ogren",  ad: "Konuyu baştan öğren" },
  { id: "tekrar", ad: "Yarın sınav: hızlı tekrar" },
  { id: "test",   ad: "Kendimi test edeyim" }
];

var PAKETLER = [
  {
    ad: "The Crucible", alt: "Savunma paketi", etiket: "Sınav · English", renk: "#E9B949",
    ana: "/crucible/", not: "Misconduct trial yazılısı",
    icerik: [
      { ad: "Savunma masası", url: "/crucible/", not: "Formül, kanıt kartları, tez fabrikası", mod: ["ogren", "tekrar"] },
      { ad: "Video + 11 tez", url: "/crucible/tezler/", not: "7 dk 50 sn · her karakter: suçlama ve savunma", mod: ["ogren", "tekrar"] },
      { ad: "Altını çiz listesi", url: "/crucible/notlar/", not: "Sayfa + alıntı + kısa avukat notu", mod: ["tekrar"] },
      { ad: "Boş sayfa provası", url: "/crucible/prova/", not: "Sıfır yardım, süreli yazma", mod: ["test"] }
    ]
  },
  {
    ad: "Human Geography", alt: "Unit 1 · Thinking Geographically", etiket: "AP", renk: "#F6B94A",
    ana: "/ap/human-geography/unit-1/", not: "12 video",
    icerik: [
      { ad: "Çalışma kiti", url: "/ap/human-geography/unit-1/", not: "12 video · bölüm soruları · ödevler", mod: ["ogren", "tekrar"] },
      { ad: "Deneme 2", url: "/ap/human-geography/unit-1/deneme-2/", not: "Zor ve süreli, Bluebook ekranı", mod: ["test"] }
    ]
  },
  {
    ad: "Statistics", alt: "Unit 1 · One-Variable Data", etiket: "AP", renk: "#5BC0EB",
    ana: "/ap/statistics/unit-1/", not: "17 video",
    icerik: [
      { ad: "Çalışma kiti", url: "/ap/statistics/unit-1/", not: "17 video · örnekli bölüm soruları", mod: ["ogren", "tekrar"] },
      { ad: "Denemeler", url: "/ap/statistics/unit-1/deneme/", not: "5 süreli deneme · 100 soru", mod: ["test"] }
    ]
  },
  {
    ad: "Business", alt: "Unit 1 · Competition and New Ideas", etiket: "AP", renk: "#3FE0A8",
    ana: "/ap/business-personal-finance/unit-1/", not: "8 video",
    icerik: [
      { ad: "Çalışma kiti", url: "/ap/business-personal-finance/unit-1/", not: "8 video · bölüm soruları", mod: ["ogren", "tekrar"] },
      { ad: "Denemeler", url: "/ap/business-personal-finance/unit-1/deneme/", not: "5 süreli deneme", mod: ["test"] }
    ]
  },
  {
    ad: "Business", alt: "Unit 2 · Marketing", etiket: "AP", renk: "#3FE0A8",
    ana: "/ap/business-personal-finance/unit-2/", not: "7 video",
    icerik: [
      { ad: "Çalışma kiti", url: "/ap/business-personal-finance/unit-2/", not: "7 video · bölüm soruları", mod: ["ogren", "tekrar"] },
      { ad: "Denemeler", url: "/ap/business-personal-finance/unit-2/deneme/", not: "5 süreli deneme", mod: ["test"] }
    ]
  },
  {
    ad: "EYP", alt: "Başlangıç paketi", etiket: "Kulüp", renk: "#2F7BFF",
    ana: "/eyp-nedir/", not: "Yeni üyeler için",
    icerik: [
      { ad: "EYP Nedir?", url: "/eyp-nedir/", not: "Konferans akışı, roller, başvuru adımları", mod: ["ogren"] }
    ]
  }
];

(function () {
  var modesEl = document.getElementById("modes"), packsEl = document.getElementById("packs");
  var KEY = "cep:mod", aktif = "hepsi";
  try { var k = localStorage.getItem(KEY); if (MODLAR.some(function (m) { return m.id === k; })) aktif = k; } catch (e) {}
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  MODLAR.forEach(function (m) {
    var b = el("button", "mode", m.ad); b.type = "button"; b.dataset.mod = m.id;
    b.addEventListener("click", function () { aktif = m.id; try { localStorage.setItem(KEY, aktif); } catch (e) {} uygula(); });
    modesEl.appendChild(b);
  });

  PAKETLER.forEach(function (p) {
    var li = el("li", "pack"), head = el("div", "pack-h"), h2 = el("h2", null, p.ad), alt = el("span", null, p.alt), list = el("div", "items"), foot = el("div", "pack-f");
    li.style.setProperty("--c", p.renk);
    head.appendChild(el("span", "mono", p.icerik.length + " parça"));
    head.appendChild(el("span", "chip", p.etiket));
    alt.lang = "en"; h2.appendChild(alt);
    p.icerik.forEach(function (c) {
      var a = el("a", "item"); a.href = c.url; a.dataset.mod = c.mod.join(" ");
      a.appendChild(el("b", null, c.ad));
      var arrow = el("i", null, "→"); arrow.setAttribute("aria-hidden", "true"); a.appendChild(arrow);
      a.appendChild(el("small", null, c.not));
      list.appendChild(a);
    });
    foot.appendChild(el("span", null, p.not));
    var open = el("a", "open", "Paketi aç "); open.href = p.ana;
    var i = el("span", null, "→"); i.setAttribute("aria-hidden", "true"); open.appendChild(i);
    foot.appendChild(open);
    li.appendChild(head); li.appendChild(h2); li.appendChild(list); li.appendChild(foot);
    packsEl.appendChild(li);
  });

  function uygula() {
    modesEl.querySelectorAll(".mode").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.mod === aktif)); });
    packsEl.querySelectorAll(".pack").forEach(function (pk) {
      var acik = 0;
      pk.querySelectorAll(".item").forEach(function (it) {
        var ok = aktif === "hepsi" || it.dataset.mod.split(" ").indexOf(aktif) > -1;
        it.classList.toggle("off", !ok); if (ok) acik++;
      });
      pk.classList.toggle("off", acik === 0);
    });
  }
  uygula();
})();
</script>
</body>
</html>
