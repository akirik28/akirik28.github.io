<head>
<meta charset="utf-8">

<meta name="description" content="AP Calculus BC Exam 1 (5 Kasım) hazırlık kiti: günlük plan, sınav kapsamındaki 25 video, konu konu hazırlık listesi, formül kartları, sık hatalar, 30 soruluk deneme ve kendin puanladığın açık uçlu sorular.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231F2A44'/%3E%3Cpath d='M12 46 C24 44 30 18 52 16' fill='none' stroke='%233D5BD9' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='31' cy='31' r='5' fill='%23F6F1E7'/%3E%3C/svg%3E">

<body style="--ders:#3D5BD9">
<noscript><p style="padding:24px;font-family:system-ui">Bu kit JavaScript ile çalışır. Tarayıcında JavaScript'i aç.</p></noscript>
<script src="veri.js?v=2"></script>
<script>
(function(){
'use strict';
const Y=YAZILI;
/* ===================== DURUM (anahtar eski kitle aynı: ilerleme kaybolmaz) ===================== */
const SK='cep-calcbc-exam1-v1';
let S={};try{S=JSON.parse(localStorage.getItem(SK)||'{}')||{};}catch(e){S={};}
S.vt=S.vt||{};S.vtRun=S.vtRun||{};S.pk=S.pk||0;S.mu=S.mu||0;S.hz=S.hz||{};S.obj=S.obj||{};S.rub=S.rub||{};S.vid=S.vid||{};S.kc=S.kc||{};S.hk=S.hk||{};S.run=S.run||{};S.acik=S.acik||{};
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}};
const esc=Y.esc, U=[1,2,3];

/* ===================== VİDEOLAR: sınav kapsamındaki 25 video ===================== */
const DISI_EP=new Set(DISI.map(d=>d[2]));
const VID=Object.keys(EP).filter(s=>!DISI_EP.has(s)).map(s=>({id:s,u:EP[s].u,src:ROOT+'unit-'+EP[s].u+'/video/'+s+'.mp4',baslik:EP[s].t,sure:SURE[s],etiket:EP[s].k}));
const toplamDk=Math.round(VID.reduce((a,v)=>a+(v.sure||0),0)/60);
const izlendi=s=>!!S.vid[s];
const uVid=u=>VID.filter(v=>v.u===u);
const unitAd=u=>UNITS[u].replace(/^Unit \d · /,'');
const vlink=s=>`<a class="y-vlink" href="#videolar/${s}" data-git="videolar/${s}">▶ ${EP[s].k} · ${esc(EP[s].t)}</a>`;


/* ===================== VİDEO + TEST AKIŞI: her videonun yanında defteri, birkaç videoda bir o videoların soruları ===================== */
const GRUP=[['cb101','cb102','cb103'],['cb104','cb105','cb106','cb107'],['cb108','cb109','cb110'],['cb201','cb202','cb203','cb204'],['cb205','cb206','cb207'],['cb208','cb209','cb210'],['cb301','cb302','cb303','cb304','cb305']];
const vidSoru=s=>TEST.map((t,i)=>i).filter(i=>OBJ[TEST[i].o].ep[0]===s);
const AKIS=[];
GRUP.forEach((g,gi)=>{g.filter(s=>VID.some(v=>v.id===s)).forEach(s=>AKIS.push({video:s}));const t=[].concat(...g.map(vidSoru));if(t.length)AKIS.push({test:t,ad:`${EP[g[0]].k.split(/[–,]/)[0]} – ${EP[g[g.length-1]].k.split(/[–,]/).pop().trim()} testi`});});
const akisBitti=(x,i)=>x.video?izlendi(x.video):S.vt[i]!=null;
const defterYol=s=>ROOT+'unit-'+EP[s].u+'/defter/?b='+s;
function akisSatir(x){return x.video?['Video',`${EP[x.video].k} · ${EP[x.video].t}`,Math.max(1,Math.round((SURE[x.video]||0)/60))+' dk · defteriyle']:['Test',x.ad,x.test.length+' soru'];}
function akis(g,alt){
  const i=alt?+alt:-1,x=AKIS[i];
  if(!x){g.innerHTML='<ol class="y-yol" style="margin-top:0">'+AKIS.map((x,i)=>{const b=akisBitti(x,i),s=akisSatir(x);
    return `<li><a class="y-yol-satir y-renk${b?' bitti':''}" style="--a:var(--r-${x.test?'mavi':'kirmizi'})" href="#akis/${i}" data-git="akis/${i}"><span class="y-adim-no">${b?Y.svg(Y.ikon.tik,15):i+1}</span><span class="m"><b>${esc(s[0]+': '+s[1])}</b><span>${esc(s[2])}</span></span><span class="say">${x.test&&b?S.vt[i]:''}</span></a></li>`;}).join('')+'</ol>';return;}
  const n=AKIS[i+1],git=n?'akis/'+(i+1):'muhtemel',nAd=n?akisSatir(n)[0]+': '+akisSatir(n)[1]:'Sınavda çıkabilecekler';
  const ust=`<div class="y-satir y-satir--ara" style="margin-bottom:14px"><a class="y-lnk" href="#akis" data-git="akis">← Akışın tamamı</a><span class="y-mini y-soluk">${i+1} / ${AKIS.length}</span></div>`;
  const son=ana=>`<div class="y-alt" style="border:0;padding-top:0;margin-top:16px"><a class="y-btn${ana?' y-btn--ana':''} y-btn--genis" href="#${git}" data-git="${git}"><span>Sıradaki: ${esc(nAd)}</span>${Y.svg(Y.ikon.ileri,18)}</a></div>`;
  if(x.video){g.innerHTML=ust+'<div data-v></div>'+`<a class="y-btn y-btn--genis" style="margin-top:12px" href="${defterYol(x.video)}">${Y.svg(Y.ikon.liste,18)}<span>Defteri aç: videonun notları</span></a>`+son(true);
    Y.videolar(g.querySelector('[data-v]'),{gruplar:[{baslik:'',videolar:VID.filter(v=>v.id===x.video)}],durum:S.vid,kaydet:save,ac:x.video});return;}
  g.innerHTML=ust+'<div data-oyn></div>'+son(false);
  S.vtRun[i]=S.vtRun[i]||{};
  Y.oynatici(g.querySelector('[data-oyn]'),{havuz:x.test,durum:S.vtRun[i],kaydet:save,
    soru:qi=>{const t=TEST[qi];return {q:t.q,o:t.o_,a:t.a,e:t.e,lang:'en'};},
    etiket:qi=>{const o=OBJ[TEST[qi].o];return `<span class="y-kod">${o.c}</span> <span lang="en">${o.en}</span>`;},
    mesaj:(p,n,tur)=>p===n?(tur==='yanlis'?'Hepsini düzelttin.':'Hepsi doğru.'):'Yanlışının videosuna bir daha bak, sonra tekrar çöz.',
    ozet:r=>{if(S.vt[i]==null){S.vt[i]=(x.test.length-r.yanlis.length)+'/'+x.test.length;save();Y.yenile();}return '';}});
}

/* ===================== SINAVDA ÇIKABİLECEKLER: öğretmenin Exam 1 hedefleri ===================== */
function muhtemel(g){
  const OZ={1:['<b>Limit:</b> grafik, tablo, cebir (0/0)','<b>Süreklilik:</b> üç şart, süreksizlik türleri','<b>Asimptot:</b> ±∞ limitleri','<b>IVT:</b> şartı yaz, sonucu söyle'],
    2:['<b>Türev tanımı:</b> limitle türev','<b>Türevlenebilir ⇒ sürekli</b>','<b>Kurallar:</b> kuvvet, çarpım, bölüm, trig'],
    3:['<b>Zincir kuralı</b>','<b>Kapalı türev:</b> her y teriminde dy/dx']};
  g.innerHTML='<p class="y-not" style="margin-bottom:14px">Exam 1: Unit 1, Unit 2, Unit 3\'ten zincir ve kapalı türev.</p>'+
    U.map(u=>`<div class="y-kart" style="margin-bottom:14px"><h2 class="y-h2" lang="en">Unit ${u} · ${esc(unitAd(u))}</h2><ul class="y-madde" style="margin-top:10px">${(OZ[u]||[]).map(m=>`<li>${m}</li>`).join('')}</ul></div>`).join('')+
    `<div class="y-kart" style="margin-bottom:14px"><h2 class="y-h2">Soru biçimleri</h2><ul class="y-madde" style="margin-top:10px"><li>Çoktan seçmeli: grafik, tablo, kurallar</li><li>Açık uçlu: işlemi göster, bir cümleyle gerekçelendir</li></ul></div>`+
    Y.katla('Öğretmenin hedef listesi',U.map(u=>`<h3 class="y-h3" lang="en" style="margin:10px 0 4px">Unit ${u}</h3><ul class="y-madde">${OBJ.filter(o=>o.u===u).map(o=>`<li><b>${o.c}</b> ${o.tr}</li>`).join('')}</ul>`).join(''),OBJ.length+' hedef')+
    `<div class="y-alt" style="border:0;padding-top:0"><button type="button" class="y-btn y-btn--ana y-btn--genis" data-oku><span>Okudum, yazılı kağıdına geç</span>${Y.svg(Y.ikon.ileri,18)}</button></div>`;
  g.querySelector('[data-oku]').onclick=()=>{S.mu=1;save();Y.yenile();Y.git('acik');};
}

/* ===================== İLERLEME ===================== */
const say=o=>Object.keys(o).length;
const P={
  akis:()=>[AKIS.filter(akisBitti).length,AKIS.length],
  muhtemel:()=>[S.mu?1:0,1],
  videolar:()=>[VID.filter(v=>izlendi(v.id)).length,VID.length],
  konular:()=>[OBJ.filter((_,i)=>S.hz[i]).length,OBJ.length],
  kartlar:()=>[KART.filter((_,i)=>S.kc[i]).length,KART.length],
  hatalar:()=>[HATA.filter((_,i)=>S.hk[i]).length,HATA.length],
  deneme:()=>(S.test&&S.test.length)?[TEST.length,TEST.length]:[S.run&&S.run.tur==='ana'&&S.run.kon?say(S.run.kon):0,TEST.length],
  acik:()=>{let a=0,b=0;ACIK.forEach((A,i)=>{const st=acikDurum(i);b+=A.rub.length;a+=st.c.filter(Boolean).length;});return [a,b];}
};
/* açık uçlu: yeni durum {t,o,c} eski S.rub işaretlerinden kurulur, ikisi birlikte güncellenir */
function acikDurum(i){
  if(!S.acik[i]){const A=ACIK[i];const c=A.rub.map((_,j)=>!!S.rub[i+'-'+j]);S.acik[i]={t:'',o:c.some(Boolean),c};}
  return S.acik[i];
}
function acikKaydet(){ACIK.forEach((A,i)=>{const st=acikDurum(i);A.rub.forEach((_,j)=>{if(st.c[j])S.rub[i+'-'+j]=1;else delete S.rub[i+'-'+j];});});save();}

/* ===================== ADIMLAR ===================== */
function plan(g){
  Y.planUst(g);
  g.insertAdjacentHTML('beforeend',`<div class="y-kart" style="margin-top:22px"><h2 class="y-h2">Sınava ne giriyor?</h2>
    <ul class="y-nokta-liste">
      <li><b>Unit 1</b> (1.2–1.16): <span lang="en">Limits and Continuity</span>, hepsi.</li>
      <li><b>Unit 2</b> (2.2–2.10): <span lang="en">Differentiation</span>, hepsi.</li>
      <li><b>Unit 3</b>: yalnız 3.1 <span lang="en">Chain Rule</span> ve 3.2 <span lang="en">Implicit Differentiation</span>.</li>
    </ul><p class="y-mini y-soluk" style="margin-top:8px">Sınav dışı: 3.3–3.6. Hesap makinesi yok; sorular İngilizce.</p></div>
    <div id="gplan-k"></div>`);
  const vidIs=(u,a,b,ad)=>{const L=uVid(u).slice(a,b);return {ad,dk:Math.round(L.reduce((x,v)=>x+v.sure,0)/60)+5,git:'videolar/'+L[0].id,ilerleme:()=>[L.filter(v=>izlendi(v.id)).length,L.length]};};
  const k=document.createElement('div');k.innerHTML=Y.katla('Günlük plan','<div id="gplan"></div>','kalan güne göre');
  g.querySelector('#gplan-k').replaceWith(k.firstChild);
  Y.gunlukPlan(g.querySelector('#gplan'),{gorevler:[
    vidIs(1,0,5,'Unit 1 videoları 1–5 (limitler)'),
    vidIs(1,5,10,'Unit 1 videoları 6–10 (süreklilik, asimptot, IVT)'),
    vidIs(2,0,5,'Unit 2 videoları 1–5 (türevin tanımı, kuvvet kuralı)'),
    vidIs(2,5,10,'Unit 2 videoları 6–10 (kurallar, çarpım, bölüm, trig)'),
    vidIs(3,0,5,'Unit 3: zincir kuralı ve kapalı türev'),
    {ad:'Konu listesinde bildiklerini işaretle',dk:15,git:'konular',ilerleme:P.konular},
    {ad:'Formül kartları + sık hatalar',dk:30,git:'kartlar',ilerleme:()=>{const a=P.kartlar(),b=P.hatalar();return [a[0]+b[0],a[1]+b[1]];}},
    {ad:'Deneme: 30 soru, süre tut',dk:60,git:'deneme',ilerleme:P.deneme},
    {ad:'Açık uçlu 2 soru, kendini puanla',dk:25,git:'acik',ilerleme:()=>{let a=0;ACIK.forEach((_,i)=>{if(acikDurum(i).o)a++;});return [a,ACIK.length];}}
  ],bosGun:{ad:'Denemedeki yanlış konuların videolarına dön',git:'deneme'},sonGun:{ad:'Hafif tekrar: formül kartları ve sık hatalar, erken uyu',git:'kartlar'}});
}

function videolar(g,alt){
  Y.videolar(g,{gruplar:U.map(u=>({baslik:`<span lang="en">Unit ${u} · ${esc(unitAd(u))}</span>`,videolar:uVid(u)})),durum:S.vid,kaydet:save,ac:alt});
}

let sadeceEksik=false;
function konular(g){
  const h=()=>{
    const [a,b]=P.konular();
    let s=`<p class="y-kucuk" style="margin-bottom:6px"><b data-say>${a}/${b}</b> konu hazır</p><div class="y-cubuk"><i style="width:${100*a/b}%"></i></div>`;
    U.forEach(u=>{
      const items=OBJ.map((o,i)=>[o,i]).filter(([o,i])=>o.u===u&&(!sadeceEksik||!S.hz[i]));
      s+=`<div class="y-blok-bas"><h2 class="y-h2" lang="en">Unit ${u} · ${esc(unitAd(u))}</h2></div>`;
      s+=`<div class="y-konular">${items.length?items.map(([o,i])=>{
        const r=S.obj[i],v=o.ep[0];
        return `<div class="y-konu${S.hz[i]?' on':''}" data-hz="${i}" role="checkbox" tabindex="0" aria-checked="${!!S.hz[i]}"><span class="y-kutu">${Y.ikon.tik}</span><div class="y-konu-m"><div class="y-konu-bas"><span class="y-kod">${o.c}</span><h3 lang="en">${o.en}</h3></div><p>${o.tr}${r?` · <span class="y-konu-sonuc ${r[0]===r[1]?'ok':'bad'}">deneme ${r[0]}/${r[1]}</span>`:''}</p></div><a class="y-play${izlendi(v)?' izlendi':''}" href="#videolar/${v}" data-git="videolar/${v}" aria-label="Video: ${esc(EP[v].t)}" title="${esc(EP[v].k+' · '+EP[v].t)}">${izlendi(v)?Y.svg(Y.ikon.tik,16):Y.ikon.oynat}</a></div>`;}).join(''):'<p class="y-soluk">Bu ünitede eksik konu kalmadı.</p>'}</div>`;
    });
    s+=Y.katla('Listede adı geçmeyen destek konular',`<p class="y-mini y-soluk" style="margin-bottom:8px">Listedeki konuların içinde kullanılıyor, aynı videolarda anlatılıyor.</p><ul class="y-nokta-liste">${DESTEK.map(([c,en,v])=>`<li>${c} <span lang="en">${en}</span> · ${vlink(v)}</li>`).join('')}</ul>`);
    s+=Y.diger(`<button type="button" class="y-lnk" data-eksik>${sadeceEksik?'Hepsini göster':'Sadece eksikleri göster'}</button>`);
    g.innerHTML=s;
    const tog=k=>{if(k.dataset.hz==null)return;const i=+k.dataset.hz;if(S.hz[i])delete S.hz[i];else S.hz[i]=1;save();
      k.classList.toggle('on',!!S.hz[i]);k.setAttribute('aria-checked',String(!!S.hz[i]));
      const [a2,b2]=P.konular();g.querySelector('[data-say]').textContent=`${a2}/${b2}`;g.querySelector('.y-cubuk i').style.width=(100*a2/b2)+'%';Y.yenile();
      if(sadeceEksik&&S.hz[i])setTimeout(h,350);};
    g.querySelectorAll('.y-konu').forEach(k=>{
      k.addEventListener('click',e=>{if(e.target.closest('.y-play'))return;tog(k);});
      k.addEventListener('keydown',e=>{if(e.target===k&&(e.key===' '||e.key==='Enter')){e.preventDefault();tog(k);}});
    });
    g.querySelector('[data-eksik]').onclick=()=>{sadeceEksik=!sadeceEksik;h();};
  };
  h();
}

function kartlar(g){
  const api=[];
  U.forEach(u=>{
    const b=document.createElement('div');b.className='y-blok';
    b.innerHTML=`<div class="y-blok-bas"><h2 class="y-h2" lang="en">Unit ${u} · ${esc(unitAd(u))}</h2></div>`;
    g.appendChild(b);
    api.push(Y.cevir(b,{kartlar:KART.map((k,i)=>({k:i,u:k.u,on:k.h,arka:k.b})).filter(k=>k.u===u),durum:S.kc,kaydet:save,ipucu:'Önce kâğıda yaz, sonra dokun'}));
  });
  g.insertAdjacentHTML('beforeend',Y.diger('<button type="button" class="y-lnk" data-hepsi>Hepsini çevir</button><button type="button" class="y-lnk" data-kapa>Hepsini kapat</button>'));
  g.querySelector('[data-hepsi]').onclick=()=>api.forEach(a=>a.hepsi(true));
  g.querySelector('[data-kapa]').onclick=()=>api.forEach(a=>a.hepsi(false));
}

function hatalar(g){
  Y.liste(g,{maddeler:HATA.map(([b,s])=>({html:`<b>${b}</b>`,alt:s})),durum:S.hk,kaydet:save,sinif:'y-hata'});
}

function deneme(g){
  Y.oynatici(g,{
    havuz:TEST.map((_,i)=>i),durum:S.run,kaydet:save,
    soru:qi=>{const t=TEST[qi];return {q:t.q,o:t.o_,a:t.a,e:t.e,lang:'en'};},
    etiket:qi=>{const o=OBJ[TEST[qi].o];return `<span class="y-kod">${o.c}</span> <span lang="en">${o.en}</span>`;},
    aciklamaEk:qi=>vlink(OBJ[TEST[qi].o].ep[0]),
    mesaj:(p,n,tur)=>tur==='yanlis'?(p===n?'Hepsini düzelttin. Açık uçlu sorulara geçebilirsin.':`${n} yanlıştan ${p} tanesini düzelttin. Kalanların videosunu izle, sonra tekrar dene.`)
      :p>=26?'Sınava hazırsın. Yanlışlarının açıklamalarını bir kez daha oku.':p>=20?'İyi gidiyorsun. Aşağıdaki konuları tekrar et, sonra yanlışları yeniden çöz.':'Önce aşağıdaki konuların videolarını bitir, sonra yanlışları tekrar çöz.',
    bitti:r=>{const per={};let p=0;TEST.forEach((it,qi)=>{const ok=r.sec[qi]===it.a&&S.run.kon[qi];if(ok)p++;per[it.o]=per[it.o]||[0,0];per[it.o][0]+=ok?1:0;per[it.o][1]++;});
      S.obj=per;S.test=(S.test||[]).concat([{p,max:TEST.length,t:Date.now()}]).slice(-10);save();Y.yenile();},
    ozet:()=>{const per=S.obj;const best=Math.max(...(S.test||[{p:0}]).map(x=>x.p));
      const uS=U.map(u=>{let a=0,b=0;Object.keys(per).forEach(o=>{if(OBJ[o].u===u){a+=per[o][0];b+=per[o][1];}});return `<div><span lang="en">Unit ${u}</span><b>${a}/${b}</b></div>`;}).join('');
      const zayif=Object.keys(per).filter(o=>per[o][0]<per[o][1]).map(Number).sort((x,y)=>x-y);
      return `<div class="y-karo">${uS}<div><span>en iyi</span><b>${best}/${TEST.length}</b></div></div>`+
        (zayif.length?`<div style="text-align:left;margin-top:20px"><h3 class="y-h3">Tekrar et</h3><ul class="y-nokta-liste">${zayif.map(o=>`<li><b>${OBJ[o].c}</b> <span lang="en">${OBJ[o].en}</span> · ${vlink(OBJ[o].ep[0])}</li>`).join('')}</ul></div>`:'');}
  });
}

function kagitHTML(){
  return '<div class="y-kagit" lang="en"><div class="ust"><h2>AP Calculus BC · Exam 1 · Free response</h2><p>No calculator · '+ACIK.reduce((a,A)=>a+A.rub.length,0)+' points · Show your work on paper.</p><div class="kim"><span>Name:</span><span>Class / no:</span><span>Score:</span></div></div>'+
    ACIK.map((A,q)=>{let c='';for(let k=0;k<10;k++)c+='<div class="c"></div>';return `<div class="s"><h3>${q+1}. ${A.t} (${A.rub.length} points)</h3><div class="y-soru">${A.q}</div>${c}</div>`;}).join('')+'</div>';
}
function acik(g){
  if(!S.ks)S.ks={a:S.pk?'puan':'',t0:0,i:0};
  Y.kagit(g,{
    ad:'Exam 1 · Free response',bilgi:`<b>${ACIK.length}</b> soru · <b>${ACIK.reduce((a,A)=>a+A.rub.length,0)}</b> puan · hesap makinesi yok`,
    not:'Bir kağıt ve kalem al. İşlemini adım adım yaz.',
    kagitHTML:kagitHTML,
    sorular:ACIK.map(A=>({puan:A.rub.length,q:A.q,lang:'en',ornek:A.cevap,olcut:A.rub.map(r=>[1,r]),
      ek:'Eksik puan aldıysan: '+[...new Set(A.o.map(o=>OBJ[o].ep[0]))].map(vlink).join(' · ')})),
    durum:acikDurum,kaydet:acikKaydet,K:S.ks,
