<head>

<title>Crucible Savunma Masası</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236e3b1f'/%3E%3Cg fill='%23e2b746' transform='rotate(-40 30 30)'%3E%3Crect x='14' y='14' width='30' height='13' rx='3'/%3E%3Crect x='26.5' y='27' width='5' height='26' rx='2.5'/%3E%3C/g%3E%3Crect x='30' y='48' width='24' height='6' rx='2' fill='%23e2b746'/%3E%3C/svg%3E">

<script>try{var t=localStorage.getItem('crucible-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{
--bg:#f3ecdf;--bg2:#e9dfcc;--card:#fffaf1;--card2:#f7efe1;--ink:#2a2017;--ink2:#6a5a49;--ink3:#93826e;
--line:#dccdb3;--wood:#6e3b1f;--wood2:#8d4e27;--wood3:#4a2714;--brass:#a77a12;--brass2:#d3a531;--brassink:#3a2a05;
--ok:#2c7a4b;--okbg:#e3f1e6;--bad:#b0362a;--badbg:#f8e3df;--warn:#a8670f;--warnbg:#f8ecd6;
--seg1:#7a4122;--seg2:#9a5a2f;--seg3:#5a2f18;--segtxt:#f6e7c8;
--shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -18px rgba(60,30,10,.45);
--r:14px;--serif:'Instrument Serif',Georgia,'Times New Roman',serif;--sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#14100c;--bg2:#1b1510;--card:#211a14;--card2:#2a2119;--ink:#f2e8d7;--ink2:#bba98f;--ink3:#8a7a66;
--line:#3a2e23;--wood:#8d4e27;--wood2:#a65f31;--wood3:#2a170b;--brass:#e0b443;--brass2:#f0c95e;--brassink:#2a1d02;
--ok:#62c48a;--okbg:#17301f;--bad:#ec6c5e;--badbg:#3a1a16;--warn:#e7a948;--warnbg:#36260f;
--seg1:#5c3018;--seg2:#7a4122;--seg3:#43220f;--segtxt:#f6e2b6;
--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -20px rgba(0,0,0,.8);color-scheme:dark;}}
:root[data-theme="dark"]{
--bg:#14100c;--bg2:#1b1510;--card:#211a14;--card2:#2a2119;--ink:#f2e8d7;--ink2:#bba98f;--ink3:#8a7a66;
--line:#3a2e23;--wood:#8d4e27;--wood2:#a65f31;--wood3:#2a170b;--brass:#e0b443;--brass2:#f0c95e;--brassink:#2a1d02;
--ok:#62c48a;--okbg:#17301f;--bad:#ec6c5e;--badbg:#3a1a16;--warn:#e7a948;--warnbg:#36260f;
--seg1:#5c3018;--seg2:#7a4122;--seg3:#43220f;--segtxt:#f6e2b6;
--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -20px rgba(0,0,0,.8);color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);min-height:100vh;
background-image:radial-gradient(1200px 500px at 80% -10%,color-mix(in srgb,var(--brass) 10%,transparent),transparent 60%);}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{margin:0;font-weight:400}
.serif{font-family:var(--serif);font-style:italic}
.mono{font-family:var(--mono)}
a{color:var(--brass)}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;color:#f6e9cf;
background:linear-gradient(180deg,#3b1f0f,#5a2f17 55%,#4a2612);border-bottom:2px solid #c99a2e;
box-shadow:0 6px 18px -10px rgba(0,0,0,.6)}
.top-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{width:34px;height:34px;flex:none;color:#e2b746}
.brand b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px;line-height:1;letter-spacing:.2px}
.brand span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.night{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid rgba(226,183,70,.35);border-radius:999px;padding:4px 12px 4px 4px}
.night button{width:30px;height:30px;border-radius:50%;border:0;background:#e2b746;color:#3a2405;display:grid;place-items:center}
.night button svg{width:14px;height:14px}
.nightinfo{display:flex;flex-direction:column;line-height:1.15}
.nightinfo b{font-family:var(--mono);font-size:15px;font-weight:500}
.nightinfo span{font-size:11px;opacity:.8;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.xpbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;min-width:92px;position:relative}
.xpbox b{font-family:var(--mono);font-size:14px;font-weight:500}
.xpbox span{font-size:11px;opacity:.8}
.xpbar{width:92px;height:4px;border-radius:4px;background:rgba(0,0,0,.3);margin-top:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#e2b746,#f6dc8a);width:0;transition:width .5s}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(226,183,70,.4);background:rgba(0,0,0,.18);color:#f6e9cf;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.planbar{position:relative;height:18px;max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 16px}
.planbar .seg{position:relative;flex:var(--w);height:6px;margin-top:6px;border-radius:3px;background:rgba(0,0,0,.28);overflow:hidden;border:0;padding:0}
.planbar .seg i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#c99a2e,#f3d27a)}
.planbar .seg.cur{box-shadow:0 0 0 1px #e2b746}
.planbar .lbl{position:absolute;top:-1px;font-size:0}
.xpfloat{position:absolute;right:0;top:-4px;font-family:var(--mono);font-weight:500;color:#ffe08a;pointer-events:none;animation:xpf 1.1s ease-out forwards;white-space:nowrap}
@keyframes xpf{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
/* ---------- tabs ---------- */
.tabs{position:sticky;top:var(--toph,62px);z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid transparent;background:none;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab .n{font-family:var(--mono);font-size:11px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);color:var(--ink2);font-weight:500}
.tab:hover{color:var(--ink)}
.tablink{text-decoration:none;color:var(--brassink);background:var(--brass2);border-color:var(--brass)}.tablink:hover{color:var(--brassink)}
.tab[aria-current="page"]{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.tab[aria-current="page"] .n{background:var(--brass);color:var(--brassink)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.view{display:none;animation:vin .35s ease}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:14px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:700}
.h1{font-family:var(--serif);font-style:italic;font-size:clamp(30px,6vw,48px);line-height:1.02;margin:4px 0 8px}
.h2{font-family:var(--serif);font-style:italic;font-size:clamp(24px,4.4vw,32px);line-height:1.1}
.lead{color:var(--ink2);margin:0 0 6px;max-width:62ch}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:9px 15px;font-weight:650;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .2s,box-shadow .2s;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,var(--brass2),var(--brass));border-color:color-mix(in srgb,var(--brass) 70%,#000);color:var(--brassink);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px -8px var(--brass)}
.btn.wood{background:linear-gradient(180deg,var(--wood2),var(--wood));border-color:var(--wood3);color:#f8ead0}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent;border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn>svg{width:14px;height:14px;flex:none}
.btn.wood .kbd,.btn.pri .kbd{color:inherit;border-color:currentColor;opacity:.7}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip.ok{color:var(--ok);background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.chip.bad{color:var(--bad);background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.chip.warn{color:var(--warn);background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.chip.brass{color:var(--brassink);background:var(--brass2);border-color:var(--brass)}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px dotted var(--brass);color:transparent;line-height:1.1;height:1.05em;vertical-align:baseline;margin:0 1px}
.tpl{font-family:var(--mono);font-size:14px;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
textarea,input[type=text],input[type=number],input:not([type]),select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus,input:focus,select:focus{border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
textarea{resize:vertical;min-height:44px;line-height:1.5}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
label.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--brass);flex:none}
details>summary{cursor:pointer;font-weight:650;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .2s;color:var(--brass)}
details[open]>summary::before{transform:rotate(90deg)}
.bar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rule{border:0;border-top:1px solid var(--line);margin:14px 0}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink2)}
/* ---------- plan ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:end;margin-bottom:16px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:500}
.stat span{font-size:12px;color:var(--ink2)}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.step.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),var(--shadow)}
.step.cur::after{content:"ŞİMDİ";position:absolute;top:8px;right:-26px;transform:rotate(35deg);background:var(--brass);color:var(--brassink);font-size:10px;font-weight:800;letter-spacing:.1em;padding:2px 30px}
.step .num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:26px;background:var(--bg2);color:var(--wood2)}
.step.done .num{background:var(--okbg);color:var(--ok)}
.step h3{font-weight:700;font-size:17px}
.step p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.step .meta{font-family:var(--mono);font-size:12px;color:var(--ink3)}
@media (max-width:560px){.step{grid-template-columns:auto 1fr}.step .go{grid-column:1/-1}}
/* ---------- formula ---------- */
.slotgrid{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin:10px 0 4px}
@media (max-width:640px){.slotgrid{grid-template-columns:repeat(13,1fr)}}
.sg{padding:0;cursor:pointer;aspect-ratio:1;border-radius:5px;background:var(--bg2);border:1px solid var(--line);font-family:var(--mono);font-size:10px;display:grid;place-items:center;color:var(--ink3);transition:background .4s}
.sg.l1{background:#c98a5a33;border-color:#c98a5a;color:var(--ink)}
.sg.l2{background:#b9c0c933;border-color:#9aa4b1;color:var(--ink)}
.sg.l3{background:var(--brass2);border-color:var(--brass);color:var(--brassink);font-weight:500}
.sg.now{outline:2px solid var(--wood2);outline-offset:1px}
.qcard{position:relative;padding:22px;min-height:260px}
.qtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.qsent{font-size:clamp(18px,3.2vw,23px);line-height:2.1;font-family:var(--serif);margin:6px 0 14px}
.qsent .blank{height:1.1em}
input.bl{display:inline-block;width:auto;font-family:var(--mono);font-size:17px;padding:2px 6px;border-radius:7px;border:0;border-bottom:2px solid var(--brass);background:color-mix(in srgb,var(--brass) 10%,var(--card));margin:0 2px;line-height:1.3;vertical-align:baseline}
input.bl.ok{border-color:var(--ok);background:var(--okbg)}
input.bl.bad{border-color:var(--bad);background:var(--badbg)}
.bignum{font-family:var(--serif);font-style:italic;font-size:72px;line-height:1;color:var(--wood2)}
.fb{margin-top:14px;border-radius:12px;padding:14px 16px;border:1px solid;animation:vin .25s}
.fb.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.fb h4{margin:0 0 6px;font-size:15px}
.fb .tpl mark{background:color-mix(in srgb,var(--bad) 22%,transparent);color:inherit;border-radius:4px;padding:0 3px;font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.okpulse{animation:okp .6s}
@keyframes okp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.breakscr{text-align:center;padding:26px 10px}
.ring{width:140px;height:140px;margin:10px auto;display:block}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--bg2)}
.ring .fg{stroke:var(--brass);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.ring text{font-family:var(--mono);font-size:22px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.reftable{display:grid;gap:8px;margin-top:10px}
.refrow{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.refrow .n{font-family:var(--mono);font-size:13px;width:30px;height:30px;border-radius:8px;background:var(--bg2);display:grid;place-items:center}
.refrow .task{font-size:12px;font-weight:700;color:var(--brass);text-transform:uppercase;letter-spacing:.06em}
.refrow .ex{font-size:13px;color:var(--ink2);font-style:italic}
.ptitle{font-family:var(--serif);font-style:italic;font-size:21px;margin-top:12px;color:var(--wood2)}
/* ---------- wheel ---------- */
.wheelwrap{position:relative;max-width:330px;margin:0 auto}
.wheel{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 18px rgba(40,20,5,.35))}
.wheel .s1{fill:var(--seg1)}.wheel .s2{fill:var(--seg2)}.wheel .s3{fill:var(--seg3)}
.wheel .segp{stroke:#c99a2e;stroke-width:1.2}
.wheel .segp.ready{opacity:.38}
.wheel text{fill:var(--segtxt);font-family:var(--sans);font-size:11.5px;font-weight:650;dominant-baseline:central}
.wheel .rim{fill:none;stroke:#c99a2e;stroke-width:6}
.wheel .rim2{fill:none;stroke:#7a5410;stroke-width:1.5}
.wheel .hub{fill:#3b1f0f;stroke:#e2b746;stroke-width:3}
.wheel .ptr{fill:#e2b746;stroke:#5a3a06;stroke-width:1.5}
.wheel .stud{fill:#e2b746}
.court{position:absolute;inset:auto 0 42%;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .3s,transform .3s}
.court.on{opacity:1;transform:none}
.court div{display:inline-block;background:rgba(25,12,4,.88);color:#f6e2b6;border:1px solid #e2b746;border-radius:10px;padding:8px 14px;box-shadow:0 10px 30px -10px #000}
.court small{display:block;font-size:10px;letter-spacing:.3em;color:#e2b746;font-weight:800}
.court span{font-family:var(--serif);font-style:italic;font-size:21px;white-space:nowrap}
.gavel{color:var(--wood2)}
.gavel .head{transform-origin:70% 85%;transform-box:fill-box}
.gavel.strike .hit{animation:strike .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes strike{0%{transform:rotate(-35deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cbtn{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-size:14px;font-weight:600;transition:transform .15s,border-color .2s}
.cbtn:hover{transform:translateY(-1px);border-color:var(--brass)}
.cbtn.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.cbtn .pr{width:28px;height:28px;flex:none}
.cbtn .pr circle{fill:none;stroke-width:4}
.cbtn .pr .bg{stroke:var(--bg2)}
.cbtn .pr .fg{stroke:var(--brass);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.cbtn.ready .pr .fg{stroke:var(--ok)}
.cbtn small{display:block;font-weight:500;font-size:11.5px;color:var(--ink3)}
.tezlayout{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.tezlayout{grid-template-columns:1fr}}
.dossier{position:relative}
.dossier .acc{background:var(--card2);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;margin:10px 0}
.arg{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--card)}
.arg .ah{display:flex;gap:10px;align-items:flex-start}
.arg .an{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1;color:var(--brass)}
.qrow{display:grid;grid-template-columns:86px 1fr 26px;gap:8px;margin-top:8px;align-items:center}
.qrow .pg{position:relative}
.qrow .pg input{padding-left:28px;font-family:var(--mono)}

.qrow .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bg2);color:var(--ink3)}

.note{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.stamp{position:absolute;top:14px;right:14px;border:3px double var(--ok);color:var(--ok);border-radius:8px;padding:4px 10px;font-weight:900;letter-spacing:.12em;font-size:15px;transform:rotate(-9deg);background:color-mix(in srgb,var(--card) 80%,transparent)}
.stamp.anim{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{opacity:0;transform:rotate(-9deg) scale(2.6)}100%{opacity:1;transform:rotate(-9deg) scale(1)}}
.timerchip{font-family:var(--mono)}
.ev{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.evh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.ev .find{font-size:14px;margin:2px 0 4px}
.ev .find .mono{font-size:13.5px;background:color-mix(in srgb,var(--brass) 14%,transparent);padding:1px 5px;border-radius:5px;color:var(--ink)}

.warnbox{margin-top:6px;border-radius:8px;padding:8px 10px;font-size:13.5px;background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-left:5px solid var(--warn);color:var(--ink)}
.warnbox b{color:var(--warn);letter-spacing:.06em}
.cortag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:middle;font-style:normal}
.pdfnote{margin-top:10px;font-size:13px}
.readyth{margin-top:10px;border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:10px;padding:10px 12px;background:var(--card2);font-size:15px}
.guide{margin:10px 0 0;padding:8px 10px 8px 30px;border-radius:10px;background:color-mix(in srgb,var(--brass) 12%,transparent);border:1px solid color-mix(in srgb,var(--brass) 35%,transparent)}.guide li{margin:2px 0}
.sev{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}

/* ---------- quiz ---------- */
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:flex-start;font-size:15px;transition:transform .12s,border-color .2s,background .2s}

.opt .k{font-family:var(--mono);font-size:12px;width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--bg2);margin-top:1px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}

.ptimer{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.ptime{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1}
.ptimer>*{min-width:0}.phases .ph{min-width:0}
@media (max-width:700px){.ptimer{grid-template-columns:1fr auto}.ptimer>div:nth-child(2){grid-column:1/-1;grid-row:2}}
.phases{display:flex;gap:3px;margin-top:6px}
.phases .ph{position:relative;height:22px;border-radius:6px;background:var(--bg2);overflow:hidden;font-size:11px;font-weight:700;display:flex;align-items:center;padding:0 8px;color:var(--ink2);border:1px solid var(--line)}
.phases .ph i{position:absolute;inset:0;width:0;background:color-mix(in srgb,var(--brass) 35%,transparent);z-index:0}
.phases .ph span{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases .ph.cur{border-color:var(--brass);color:var(--ink)}
.counters{position:sticky;top:calc(var(--toph,62px) + 50px);z-index:15;display:flex;gap:6px;flex-wrap:wrap;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 0;margin:10px 0 0;border-bottom:1px solid var(--line)}
.ctr{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 10px;min-width:84px;transition:border-color .3s,background .3s}
.ctr b{font-family:var(--mono);font-size:17px;font-weight:500;line-height:1.1}
.ctr span{font-size:11px;color:var(--ink2);white-space:nowrap}
.ctr.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--okbg)}
.ctr.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:var(--badbg)}
.ctr.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:var(--warnbg)}
.ctr.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.08)}}
.provalayout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start;margin-top:12px}

.side{position:sticky;top:calc(var(--toph,62px) + 120px);max-height:calc(100vh - var(--toph,62px) - 140px);overflow:auto}
@media (max-width:980px){.side{position:static;max-height:none}}
.phead{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px}
.phead h3{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--wood2)}
.slot{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.slot .sn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;background:var(--bg2);color:var(--ink2);transition:background .3s}
.slot.filled .sn{background:var(--brass2);color:var(--brassink)}
.slot.warn .sn{background:var(--warn);color:#fff}
.slot .sm{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.slot .sm b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--brass)}
.slot .sm .tpl{font-size:12px;color:var(--ink2);line-height:1.4}
.slot textarea{min-height:44px;font-size:15.5px}
.slot .flags{font-size:12px;color:var(--warn);margin-top:4px;min-height:0}
.slot .flags:empty{display:none}
.slot .flags.rp{color:var(--warn);background:var(--warnbg);border-radius:6px;padding:3px 8px;margin-top:4px}
.slot.jump{animation:okp .9s}
.sidebox h4{margin:12px 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.qlist{margin:0;padding:0;list-style:none;font-size:13.5px}
.qlist li{padding:5px 0;border-bottom:1px dashed var(--line)}
.qlist .pgn{font-family:var(--mono);font-weight:500;color:var(--wood2)}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.scorebig{font-family:var(--serif);font-style:italic;font-size:84px;line-height:.9;color:var(--wood2)}
.scorebig small{font-size:34px;color:var(--ink3)}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}

.part{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card2)}

.part h4 b{font-family:var(--mono);font-size:20px;font-weight:500}
.part ul{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.part li{display:grid;grid-template-columns:18px 1fr auto;gap:6px;padding:3px 0}
.part li .pt{font-family:var(--mono);color:var(--ink2)}
.yes{color:var(--ok);font-weight:800}.no{color:var(--bad);font-weight:800}
.rules{font-size:13.5px;color:var(--ink2)}
.rules li{margin:4px 0}
.rules code{font-family:var(--mono);font-size:12.5px;background:var(--bg2);padding:0 4px;border-radius:4px;color:var(--ink)}
/* ---------- badges ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;background:var(--card);opacity:.5;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--brass);box-shadow:0 0 0 1px color-mix(in srgb,var(--brass) 50%,transparent),var(--shadow)}
.badge .ic{width:54px;height:54px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:26px;background:radial-gradient(circle at 35% 30%,#f6dc8a,#c99a2e 60%,#8a6410);color:#3a2405;box-shadow:0 0 0 3px var(--card),0 0 0 4px #c99a2e}

.badge b{display:block;font-size:14px}
.badge span{font-size:12px;color:var(--ink2)}
/* ---------- sabah kartı ---------- */
.sheet{background:#fffdf8;color:#1d150e;border-radius:6px;padding:22px 24px;box-shadow:0 20px 40px -24px rgba(0,0,0,.5);max-width:820px;margin:14px auto 0;font-size:12.5px;line-height:1.35;border:1px solid #e3d6bd}

.sheet .cc b{font-size:12px}
.sheet .cc .th{font-size:11px;margin:1px 0}
.sheet .cc .pp{font-family:var(--mono);font-size:10.5px;color:#5a3a20}
.sheet .empty{color:#a0907a;font-style:italic}

#toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(94vw,460px);pointer-events:none}

.toast button{pointer-events:auto;border:0;background:#e2b746;color:#3a2405;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;z-index:70;background:rgba(12,6,2,.72);display:grid;place-items:center;padding:16px;animation:vin .3s}
.ov .box{max-width:560px;width:100%;background:var(--card);border:1px solid var(--brass);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 30px 80px -20px #000;max-height:92vh;overflow:auto}

.storagewarn{background:var(--warnbg);color:var(--warn);font-size:13px;padding:6px 16px;text-align:center}

eşine düşmenin büyük tehlike olduğunu söyler ve suçu kendimizde aramayı önerir; bir sayfa önce (s.27) 11 çocuğu ve 26 torunu olduğunu anlatır.","use":"From the very beginning Rebecca warned the village against hunting for spirits (Miller __).","bookPage":26,"bookPageSource":"foto"},{"arg":3,"act":"Act Four","pdfPage":140,"who":"Rebecca","find":"how may I damn myself?","what":"Danforth itiraf etmesini isteyince Rebecca yalan olduğu için kendini lanetleyemeyeceğini söyler; hayatı pahasına yalan söylemez.","use":"Offered her life in exchange for a lie, Rebecca refuses to damn herself (Miller __).","bookPage":130,"bookPageSource":"tahmin"},{"arg":3,"act":"Act Four","pdfPage":144,"who":"Rebecca","find":"Another judgment waits us all!","what":"İdama götürülürken Rebecca çevresindekilere korkmamalarını, asıl yargının Tanrı'nın olduğunu söyler; sonuna kadar sakin ve imanlıdır.","use":"Even on her way to the gallows, Rebecca comforts others (Miller __).","bookPage":134,"bookPageSource":"tahmin"},{"arg":"pathos","act":"Act Four","pdfPage":139,"who":"Sahne yönergesi","find":"She is barely able to walk.","what":"Act 4'te Rebecca, Herrick'in desteğiyle içeri girer ve zar zor yürür; yaşlı ve bitkin bir kadının idama götürülmesi pathos için güçlü bir görüntüdür.","use":"A seventy-two-year-old woman, barely able to walk, is brought in to watch others confess (Miller __).","warning":"SPEC 'zincirli yaşlı kadın' diyor; metin Rebecca'nın zincirli olduğunu söylemez. Act 4'te zincir Proctor'un bileklerindedir (s.133), Act 2'de Elizabeth için geçer (s.78).","bookPage":129,"bookPageSource":"tahmin"}],"Elizabeth Proctor":[{"arg":1,"act":"Act Two","pdfPage":75,"who":"Mary Warren","find":"I made it in the court, sir","what":"Mary Warren bebeği mahkemede kendisinin diktiğini ve o akşam Elizabeth'e verdiğini söyler; iğneyi sorunca 'sanırım ben taktım' der (aynı sayfa).","use":"Mary Warren openly states that she made the poppet in court and gave it to Elizabeth (Miller __).","warning":"İğne konusunda Mary kesin değil, tereddütlüdür ('I - I believe I did'). Act 3'te Danforth bunu 'iğneyi kendisi taktı' diye özetler (s.103).","bookPage":71,"bookPageSource":"foto"},{"arg":1,"act":"Act Two","pdfPage":76,"who":"Mary Warren","find":"Abby sat beside me when I made it.","what":"Mary, bebeği dikerken Abigail'in yanında oturduğunu söyler; yani Abigail iğneyi görmüş olabilir.","use":"Mary adds that Abigail was sitting beside her when she made the poppet (Miller __).","bookPage":72,"bookPageSource":"foto"},{"arg":2,"act":"Act Three","pdfPage":112,"who":"Danforth / Elizabeth","find":"you dismissed your servant, Abigail Williams.","what":"Elizabeth Abigail'i evden kovduğunu doğrular; Abigail de Act 1'de Proctor'a 'beni o kovdu' der (s.22) — Abigail'in ona kin beslemek için nedeni vardı.","use":"Elizabeth had dismissed Abigail from her house, which gave Abigail every reason to hate her (Miller __).","bookPage":105,"bookPageSource":"tahmin"},{"arg":2,"act":"Act One","pdfPage":19,"who":"Betty","find":"a charm to kill John Proctor's wife","what":"Betty, Abigail'in Elizabeth'i öldürmek için tılsım içtiğini açıklar; Abigail'in Elizabeth'i ortadan kaldırma isteği daha Act 1'de ortadadır.","use":"Long before any poppet, Betty reveals that Abigail drank a charm to kill Elizabeth (Miller __).","bookPage":18,"bookPageSource":"foto"},{"arg":3,"act":"Act Three","pdfPage":113,"who":"Danforth / Elizabeth","find":"is your husband a lecher!","what":"Elizabeth kocasının onurunu korumak için 'Hayır, efendim' der; oyundaki tek yalanı sevgiden doğar (Proctor ise s.92'de onun asla yalan söylemeyeceğini söyler).","use":"Elizabeth's only lie in the whole play was told out of love, to protect her husband's name (Miller __).","bookPage":107,"bookPageSource":"tahmin"},{"arg":3,"act":"Act Four","pdfPage":137,"who":"Elizabeth","find":"It needs a cold wife to prompt lechery.","what":"Elizabeth Act 4'te kendi soğukluğunun da payı olduğunu itiraf eder; dürüst ve kendini sorgulayan bir kadındır.","use":"In the last act Elizabeth honestly admits her own coldness (Miller __).","bookPage":127,"bookPageSource":"tahmin"},{"arg":"pathos","act":"Act Four","pdfPage":130,"who":"Danforth / Herrick","find":"well on with child now","what":"Danforth Elizabeth'in hamileliğinin ilerlediğini söyler, Herrick doğrular; Act 3'te hamileliğini mahkemeye bildirmişti (s.92).","use":"The accused stands in a prison cell, pregnant with her husband's child (Miller __).","bookPage":120,"bookPageSource":"tahmin"},{"arg":2,"act":"Act Two","pdfPage":60,"who":"Elizabeth","find":"She wants me dead.","what":"Mary Warren mahkemede Elizabeth'in adının geçtiğini söyleyince Elizabeth bunun arkasında Abigail'in olduğunu hemen anlar ve Abigail'in kendisini ölü görmek istediğini söyler.","use":"As soon as she hears that her name was mentioned in court, Elizabeth realizes that Abigail wants her dead (Miller 57).","added":"act12","bookPage":57,"bookPageSource":"foto"},{"arg":2,"act":"Act Two","pdfPage":61,"who":"Elizabeth","find":"There is a promise made in any bed","what":"Elizabeth, Proctor ile Abigail arasında konuşulmasa bile bir söz verilmiş sayıldığını, Abigail'in buna tutunduğunu ve kendisini öldürüp yerini almayı düşündüğünü söyler; Abigail'in amacı Proctor'dur.","use":"Elizabeth understands that Abigail hopes to get rid of her and take her place beside John Proctor (Miller 58).","added":"act12","bookPage":58,"bookPageSource":"foto"}],"Sarah Good":[{"arg":1,"act":"Act Two","pdfPage":57,"who":"Mary Warren","find":"whenever I turned her away empty, she mumbled","what":"Mary'ye göre Sarah Good kapıya ekmek ve elma şarabı dilenmeye gelir, eli boş gönderilince mırıldanırmış; suçlama yalnızca bu mırıltıya dayanır.","use":"The charge rests on nothing more than a hungry beggar mumbling when she was turned away (Miller __).","bookPage":55,"bookPageSource":"foto"},{"arg":1,"act":"Act Two","pdfPage":57,"who":"Elizabeth","find":"She may mumble if she's hungry.","what":"Elizabeth hemen itiraz eder: aç biri mırıldanabilir; yoksulluk ve açlık suç değildir.","use":"As Elizabeth Proctor points out, a hungry woman may mumble without being a witch (Miller __).","bookPage":55,"bookPageSource":"foto"},{"arg":2,"act":"Act Two","pdfPage":58,"who":"Mary Warren","find":"of all the ten she could not","what":"Mary'nin anlatımına göre Sarah Good on emirden hiçbirini sayamadı ve bu 'yalan' sayıldı; bu eğitimsizliğin kanıtıdır, büyünün değil.","use":"Sarah Good was condemned partly because she could not recite the Commandments (Miller __).","bookPage":55,"bookPageSource":"foto"},{"arg":2,"act":"Act Two","pdfPage":58,"who":"Elizabeth","find":"and that's an upright answer","what":"Sarah'nın 'Sadece emirlerimi söylüyorum' cevabını Elizabeth dürüst bir cevap olarak görür.","use":"Even Elizabeth Proctor judged Sarah Good's answer to be an honest one (Miller __).","bookPage":55,"bookPageSource":"foto"},{"arg":3,"act":"Act Two","pdfPage":59,"who":"Mary Warren","find":"Sarah Good will only sit in jail","what":"Mary, itiraf edenlerin asılmadığını, Sarah Good'un itiraf ettiği için yalnızca hapis yatacağını anlatır (itiraf haberi s.56); itiraf hayatta kalma yoluydu.","use":"In this court, confession meant survival: Sarah Good confessed and was spared the rope (Miller __).","bookPage":56,"bookPageSource":"foto"},{"arg":3,"act":"Act One","pdfPage":47,"who":"Tituba","find":"and there was Goody Good","what":"Sarah Good'un adını ilk veren, tehdit ve yönlendirme altındaki Tituba'dır (s.44-46).","use":"Sarah Good was first named by Tituba, who spoke under threats of whipping and hanging (Miller __).","bookPage":44,"bookPageSource":"foto"},{"arg":"dikkat","act":"Act Four","pdfPage":121,"who":"Sahne yönergesi","find":"Sarah Good, rising in her rags","what":"Sarah Good sahnede yalnızca Act 4 başında, hücrede Tituba ile görünür; paçavralar içinde ve kafası karışıktır. Hakkındaki diğer her şey Mary'nin anlatımıdır; bilgi ekleme.","use":"Sarah Good, the woman in rags in the jail cell, is a victim of poverty, not a servant of the Devil (Miller __).","warning":"Mary s.59'da Sarah Good'un hamile olduğunu, Elizabeth 'altmışına yakın' olduğunu söyler — bunlar karakterlerin sözleridir, kesin bilgi gibi sunma.","bookPage":113,"bookPageSource":"tahmin"}],"Mary Warren":[{"arg":1,"act":"Act Two","pdfPage":59,"who":"Mary Warren","find":"I saved her life today!","what":"Mary mahkemede Elizabeth'in adı geçince onu savunduğunu söyler; bunu Proctor kırbacını kaldırmışken haykırır (aynı sayfada Proctor onu kırbaçla tehdit eder).","use":"Mary Warren defended Elizabeth in court and saved her life (Miller __).","bookPage":56,"bookPageSource":"foto"},{"arg":1,"act":"Act Three","pdfPage":89,"who":"Mary Warren","find":"It were pretense, sir.","what":"Mary Act 3'te mahkemede kızların numara yaptığını söyler; gerçeği söylemeye çalışan tek kızdır.","use":"Mary Warren was the only girl brave enough to tell the court it was all pretense (Miller __).","bookPage":82,"bookPageSource":"tahmin"},{"arg":2,"act":"Act Three","pdfPage":117,"who":"Danforth","find":"You will confess yourself or you will hang!","what":"Danforth Mary'yi sert biçimde döndürüp itiraf etmezse asılacağını söyler; ifadesi ölüm tehdidi altında değişir.","use":"Mary changed her testimony only after Judge Danforth threatened her with hanging (Miller __).","bookPage":110,"bookPageSource":"tahmin"},{"arg":2,"act":"Act Three","pdfPage":115,"who":"Mary Warren / kızlar","find":"Abby, you mustn't!","what":"'Kuş' sahnesinde kızlar Mary'nin her sözünü taklit ederek onu köşeye sıkıştırır; Mary kendini savunamaz hale gelir.","use":"In the 'bird' scene the girls mimic Mary's every word until she is trapped (Miller __).","bookPage":108,"bookPageSource":"tahmin"},{"arg":3,"act":"Act One","pdfPage":18,"who":"Sahne yönergesi","find":"she is seventeen, a subservient, naive, lonely girl","what":"Sahne yönergesi Mary'yi 17 yaşında, boyun eğen, saf ve yalnız bir kız olarak tanıtır.","use":"Miller describes Mary as a seventeen-year-old, subservient, naive and lonely girl (Miller __).","bookPage":17,"bookPageSource":"foto"},{"arg":3,"act":"Act Three","pdfPage":118,"who":"Mary Warren","find":"I'll not hang with you!","what":"Mary çöker ve Proctor'u suçlar; hemen öncesinde asılmakla tehdit edilmiştir — çöküşü korkunun sonucudur.","use":"Mary's collapse is the cry of a terrified girl who does not want to hang (Miller __).","bookPage":111,"bookPageSource":"tahmin"},{"arg":1,"act":"Act One","pdfPage":18,"who":"Mary Warren","find":"Abby, we've got to tell.","what":"Act 1'de Mary, cadılığın asılmayla cezalandırıldığını hatırlatarak Abigail'e ormanda olanları anlatmaları gerektiğini söyler; gerçeği söylemeyi en başta öneren odur.","use":"From the very first scene, Mary urged Abigail to tell the truth about what happened in the forest (Miller 18).","added":"act12","bookPage":18,"bookPageSource":"foto"},{"arg":2,"act":"Act Two","pdfPage":59,"who":"Proctor","find":"I'll whip the Devil out of you!","what":"Proctor, Mary'nin mahkemeye gitmeye devam edeceğini duyunca kırbacını kaldırıp onu dövmekle tehdit eder; Mary'nin üzerindeki baskı yalnızca kızlardan değil, işvereninden de gelir.","use":"Her own master raised his whip and threatened to beat her (Miller 56).","added":"act12","bookPage":56,"bookPageSource":"foto"},{"arg":3,"act":"Act Two","pdfPage":80,"who":"Mary Warren","find":"She'll kill me for sayin' that!","what":"Proctor, Mary'den mahkemede iğneli bebeğin gerçeğini söylemesini isteyince Mary, Abigail'in kendisini öldüreceğinden korktuğunu haykırır; ifadeleri korkuyla şekillenen genç bir hizmetçidir.","use":"Mary cries out that Abigail will kill her if she tells the truth, which shows how terrified she was (Miller 76).","added":"act12","bookPage":76,"bookPageSource":"foto"}],"Giles Corey":[{"arg":1,"act":"Act Three","pdfPage":96,"who":"Giles","find":"forfeit up his property","what":"Giles, Jacobs cadı diye asılırsa malının satılacağını ve onu alacak paranın yalnızca Putnam'da olduğunu söyler; Putnam'ın toprak hırsını ifşa eder.","use":"Giles exposed Putnam's motive: a hanged man's land could be bought by the only man with the money (Miller __).","bookPage":90,"bookPageSource":"tahmin"},{"arg":1,"act":"Act Three","pdfPage":97,"who":"Giles","find":"lay in jail if I give his name","what":"Giles tanığının adını vermez çünkü verirse o adam hapse girecektir; başkasını korumak için kendini riske atar.","use":"Giles refused to name his witness only because that man would be thrown in jail (Miller __).","bookPage":90,"bookPageSource":"tahmin"},{"arg":2,"act":"Act Two","pdfPage":71,"who":"Giles","find":"I never said my wife were a witch","what":"Giles karısına cadı demediğini, sadece kitap okuduğunu söylediğini belirtir.","use":"Giles never called his wife a witch; he only said she was reading books (Miller __).","warning":"Dikkat: Act 1'de (s.40) Giles kitap meselesini bizzat Hale'e açar ('It discomfits me!'); şüpheyi o başlatmış sayılabilir.","bookPage":68,"bookPageSource":"foto"},{"arg":2,"act":"Act Three","pdfPage":86,"who":"Giles","find":"I have broke charity with the woman","what":"Giles mahkemede ağlayarak karısına haksızlık ettiğini söyler; pişmanlığı samimidir.","use":"Weeping in court, Giles admits he wronged his wife (Miller __).","bookPage":80,"bookPageSource":"tahmin"},{"arg":3,"act":"Act Four","pdfPage":135,"who":"Elizabeth","find":"great stones they lay upon his chest","what":"Elizabeth, Giles'ın suçlamaya evet ya da hayır demediği için göğsüne ağır taşlar konarak öldürüldüğünü anlatır.","use":"Giles Corey was pressed to death under great stones rather than answer the charge (Miller __).","bookPage":125,"bookPageSource":"tahmin"},{"arg":3,"act":"Act Four","pdfPage":135,"who":"Elizabeth","find":"so his sons will have his farm","what":"Elizabeth, Giles susarak öldüğü için mahkûm edilmediğini ve çiftliğin oğullarına kaldığını anlatır; ölümünü ailesi için seçmiştir.","use":"By staying silent, Giles made sure that his sons would keep his farm (Miller __).","bookPage":125,"bookPageSource":"tahmin"},{"arg":"pathos","act":"Act One","pdfPage":25,"who":"Sahne yönergesi","find":"Giles Corey, eighty-three, enters.","what":"Sahne yönergesi Giles'ın 83 yaşında olduğunu söyler; seksenini geçmiş bir adamın taş altında ezilmesi pathos için güçlüdür.","use":"An eighty-three-year-old man was crushed under stones (Miller __).","bookPage":23,"bookPageSource":"foto"},{"arg":1,"act":"Act One","pdfPage":32,"who":"Putnam","find":"That tract is in my bounds","what":"Act 1'de Proctor kendi ormanından kereste getireceğini söyleyince Putnam o arazinin kendi sınırları içinde olduğunu iddia eder; Putnam'ın toprak hırsı daha ilk perdede görülür ve Giles'ın Act 3'teki suçlamasını destekler.","use":"Already in the first act, Thomas Putnam claims that Proctor's forest lies within his own bounds (Miller 30).","added":"act12","bookPage":30,"bookPageSource":"foto"},{"arg":2,"act":"Act One","pdfPage":40,"who":"Giles","find":"what signifies the readin' of strange books","what":"Giles, karısının okuduğu kitapların ne anlama geldiğini Hale'e soru olarak sorar; Martha'yı suçlamaz, bilgili bir adama danışır.","use":"Giles only asked the learned minister what the reading of strange books might signify (Miller 37).","warning":"Dikkat: Aynı konuşmada Giles, karısı kitap okurken dua edemediğini de söyler ('It discomfits me!'); savcı şüpheyi onun başlattığını söyleyebilir — 'sadece soru sordu, karısına cadı demedi' diye savun.","added":"act12","bookPage":37,"bookPageSource":"foto"},{"arg":2,"act":"Act Two","pdfPage":70,"who":"Giles","find":"They take my wife.","what":"Act 2'de Giles Proctor'ların evine koşar ve karısının götürüldüğünü söyler; hemen ardından Hale'e Martha'ya cadı demediğini anlatır — tutuklamadan sarsılmış, karısını korumaya çalışan bir kocadır.","use":"Giles rushes to the Proctors' house, shaken because the court has taken his wife (Miller 67).","added":"act12","bookPage":67,"bookPageSource":"foto"}]}};

window.ANALIZ={"characters":{"Giles Corey":{"motivasyon":["İnatçı, kavgacı ama özünde dürüst ve cesur yaşlı bir çiftçi; çok dava açtığı için yasayı iyi bilir (LitCharts, GradeSaver).","Adalet duygusu ve dostlarına sadakat: Thomas Putnam'ın suçlamaları toprak ele geçirmek için kullandığına inanır ve bunu ifşa etmek ister (GradeSaver, Wikipedia).","Son kararında ailesini korumak: susarak çiftliğin oğullarına kalmasını sağlar (Wikipedia, EBSCO)."],"savunma":["Act 1: Hale'e yalnızca karısı Martha'nın sakladığı kitapların ne anlama geldiğini sorar ve onun Şeytan'la ilgisi olduğunu iddia etmediğini açıkça söyler; Act 2'de Martha tutuklanınca karısına cadı demediğini, sadece kitap okuduğunu söylediğini haykırır. Kötü niyet yok, bilgisiz bir merak var.","Act 2: Martha'yı resmen suçlayan Walcott'tur (domuz meselesi); tutuklama emrini mahkeme çıkarır. Giles'ın sorusu suçlamanın kendisi değildir.","Act 3: Putnam'ın kızına George Jacobs'ı suçlattığını, Jacobs asılırsa malının satılacağını ve onu alabilecek tek kişinin Putnam olduğunu söyleyen bir ifade getirir. Tanığın adını vermez, çünkü o kişi hapse girecektir; karısının adını bir kez söylemenin pişmanlığını taşıdığını ekler. Bu saygısızlık değil, bir masumu korumaktır.","Act 4 (Elizabeth anlatır): suçlamaya evet ya da hayır demez; inkâr etse asılacak ve malı satılacaktı. Susarak oğullarına çiftliği bırakır ve taşlarla ezilerek ölür. İtirafla kurtulma yolunu bile reddeden bir vicdan."],"savci":[{"iddia":"Karısının tutuklanmasına kendisi yol açtı.","cevap":"Act 1'de soruyu bir uzmana iyi niyetle sordu, cadı demedi; Martha'yı Walcott suçladı, tutuklamayı mahkeme yaptı."},{"iddia":"Mahkemeye saygısızlık etti, iddiasını kanıtlayamadı.","cevap":"Kanıt olarak istenen şey bir tanığı hapse göndermekti; Giles'ın suskunluğu korkudan değil, korumadan."}],"kontrol":["✔ Act 3 ifadesi (Putnam, kızı, George Jacobs, toprak) ve isim vermeme nedeni (o adam hapse girecek) metinle birebir uyumlu.","⚠ \"Sadece kitapları sordu\" sahnesi Act 1'dedir (Hale geldikten sonra). Act 2'de ise Martha'nın tutuklanması ve Giles'ın \"cadı demedim\" çıkışı var. Kitapta bul listesine Act 1'i ekle.","✔ \"Pişmanlığı samimi\": Act 3'te karısının adını bir kez ağzına aldığı için pişman olduğunu söyler; bunu kanıt olarak gösterebilirsin.","✔ Act 4 ezilerek ölüm ve gerekçesi (oğullarına toprak) Elizabeth'in anlatımında var. Yaş: Act 1 sahne notunda 83, \"seksenini geçmiş\" doğru.","⚠ \"More weight\" sözünü Act 4'te Elizabeth aktarır. Tarihî Giles hakkındaki tartışmalar (Wikipedia) oyuna ait değil; kullanma."],"kaynaklar":["LitCharts – Giles Corey Character Analysis","GradeSaver – The Crucible Character List","EBSCO Research Starters – The Crucible: Analysis of Major Characters","Wikipedia – The Crucible"]},"Rev. John Hale":{"motivasyon":["Kendini bir bilim insanı, \"ruh hekimi\" olarak gören, kitaplarıyla Şeytan'ı tespit edebileceğine inanan uzman; başta dünyayı siyah-beyaz görür (LitCharts, GradeSaver).","Gerçeği bulma isteği: diğer din adamlarından farklı olarak kanıtlara bakmaya devam ettiği için masumiyeti görmezden gelemez (LitCharts).","Act 4'te suçluluk ve vicdan: masumların ölümüne katkıda bulunduğu duygusu; bazı yorumcular kendi vicdanını rahatlatma isteğini de görür (GradeSaver, PrepScholar)."],"savunma":["Act 1: Parris onu davet eder; Hale uzman olarak gelir ve batıl inanca değil kesin işaretlere bakılacağını söyleyerek temkinli başlar.","Act 2: Kendi isteğiyle evleri dolaşıp Proctor'ları sorgular, çünkü suçlananlar hakkında kendi fikrini oluşturmak ister. Rebecca'nın suçlandığını öğrenince derinden sarsılır.","Act 3: Kesin kanıt olmadan can almayacağını söyleyip Proctor'un avukat getirmesini savunur; sonunda mahkemeyi kınayıp istifa eder. Sistemin içinden karşı çıkan tek yetkili odur.","Act 4: Kendi isteğiyle geri döner, mahkûmları yaşamaları için ikna etmeye çalışır ve idamların ertelenmesini ister. Pişmanlığını eylemiyle göstermiştir."],"savci":[{"iddia":"Act 1'de Tituba'ya isim verdirdi.","cevap":"Hale koruma vaat edip kim olduklarını sordu, ama Sarah Good ve Osburn adlarını ilk ağzına alan Thomas Putnam'dı."},{"iddia":"İdam emirleri imzaladı.","cevap":"Bunu Act 3'te kendisi açıkça söyler ve tam bu yüzden kesin kanıt ister; sonunda istifa eder."},{"iddia":"Act 4'te insanları yalan söylemeye teşvik etti.","cevap":"Amacı can kurtarmaktı; hayatı korumayı seçmek suç değil, vicdandır."}],"kontrol":["✔ Act 1'deki \"batıl inanç değil\" tutumu, Act 3'teki kınama ve istifa, Act 4'teki dönüş metinle uyumlu.","⚠ Act 2: Elizabeth'in Rebecca'yla ilgili sorusuna Hale önce bunun \"mümkün\" olduğunu söyler; asıl sarsılma Francis suçlamayı okuyunca gelir ve yine de mahkemeye güvenmelerini öğütler. \"Rahatsız oldu\" doğru; \"Rebecca'yı savundu\" deme.","⚠ İmzaladığı idam emirlerinin sayısını (Act 3) Hale kendi ağzından söyler; savcı da kullanacak, önceden cevapla.","⚠ Wikipedia'da Hale \"genç\" diye geçer; oyunun sahne notu onu kırka yakın diye tanıtır. Yaş kullanma."],"kaynaklar":["LitCharts – Reverend Hale Character Analysis","GradeSaver – The Crucible Character List","PrepScholar – Why has Reverend Hale returned to Salem?","York Notes GCSE – The Crucible character revision cards","EBSCO Research Starters – The Crucible: Analysis of Major Characters"]},"Rev. Samuel Parris":{"motivasyon":["İtibar ve mevki kaygısı: birilerinin onu kovmak, adını lekelemek için plan yaptığına dair neredeyse paranoyak bir inanç (LitCharts, eNotes).","Maddi güvenlik: maaş, odun, papaz evinin tapusu, altın şamdanlar (GradeSaver).","Kızının durumu ve ailesinin adı için korku; yorumcuların çoğu bunu itibar kaygısının gerisinde görür (eNotes)."],"savunma":["Act 1 açılış: Kızının yatağı başında dua eden korkmuş bir baba; doktoru ve Beverly'den Hale'i çağırır. Açıklamayı kendisi uydurmadı, uzman getirdi.","Act 1: Abigail'i sorgulayıp ormanda ne olduğunu öğrenmeye çalışır; köyün dedikodusundan korkar. Korku ve endişe suç değildir.","Act 4: Abigail parasını çalıp Mercy Lewis ile kaçmıştır, kapısında bir bıçak bulmuştur. O da Abigail tarafından kandırılan bir kurbandır.","Act 4: Danforth'tan idamları ertelemesini ister, Proctor'a itiraf edip yaşaması için yalvarır. Ölümlerin durmasını isteyen adamdır."],"savci":[{"iddia":"İtibarı için masumlara karşı tanıklık etti; Act 3'te Mary Warren'a ve Proctor'a saldırdı.","cevap":"Korkuyla hareket etti; karar veren o değil, Danforth ve Hathorne'du. Endişe suç değildir."},{"iddia":"Act 1'de tek derdi maaşı, odunu ve tapusuydu.","cevap":"Açgözlülük bir karakter kusurudur; bu mahkemede yargılanan suç değildir."},{"iddia":"Act 4'teki erteleme isteği vicdandan değil, isyan ve kendi canı korkusundan.","cevap":"Gerekçesi ne olursa olsun darağacını durdurmaya çalıştı; sonuç can kurtarmaktı."}],"kontrol":["✔ Doktor ve Hale'i çağırması (Act 1), Abigail'in parayı alıp kaçması ve kapıdaki bıçak (Act 4), erteleme isteği ve Proctor'a yalvarması (Act 4) metinde var.","⚠ Act 4'te Parris erteleme gerekçesini isyan korkusu (Andover söylentisi) ve saygın kişilerin asılmasının tepki çekeceği diye açıklar. \"Vicdan\" deme; \"ölümleri durdurmaya çalıştı\" de.","⚠ Kaçışın kesin olduğu doğru, ama \"gemiye bindiler\" Parris'in tahminidir. Paranın miktarını yazacaksan kitaptan kontrol et (Act 4).","⚠ \"Worry is not a crime\" senin cümlen; oyundan alıntıymış gibi tırnakla sunma."],"kaynaklar":["LitCharts – Reverend Parris Character Analysis","GradeSaver – The Crucible Character List","eNotes – Why does Parris care about his reputation?","EBSCO Research Starters – The Crucible: Analysis of Major Characters","Wikipedia – The Crucible"]},"Goody Ann Putnam":{"motivasyon":["Yas: yedi bebeği doğdukları gece ölmüş, tek yaşayan çocuğu Ruth da tuhaflaşmıştır; analistler onu kasıtlı kötü değil, açıklama arayan öfkeli ve acılı bir anne olarak görür (Shmoop, CliffsNotes).","Rebecca'ya kıskançlık: Rebecca'nın 11 çocuğu var ve hiçbirini kaybetmemiştir (eNotes).","Kocası Thomas Putnam'ın toprak ve itibar hırsı ailenin tutumunu besler (LitCharts, eNotes)."],"savunma":["Act 1: Yedi bebeğini kaybettiğini, Ruth'u ölü kardeşlerinin ruhuyla konuşsun diye Tituba'ya gönderdiğini anlatır. Amaç zarar vermek değil, bir annenin cevap arayışıdır.","Act 1: Doğaüstü açıklama arayan tek kişi o değildir; Parris, Hale ve sonra mahkeme aynı inancı resmî olarak benimser. Ann dönemin inancını paylaşan bir köylüdür.","Act 3: Giles'ın ifadesi toprak hırsını Thomas Putnam'a bağlar (kızına Jacobs'ı suçlatma); bu ifadede Ann'in adı geçmez.","Act 2: Rebecca'yı tutuklayan mahkemedir; tutuklama emri Putnam bebeklerinin \"doğaüstü\" ölümüne dayanır, yani somut kanıt yoktur. Kararı Ann değil mahkeme verdi."],"savci":[{"iddia":"Ruth'u ölüleri çağırmaya gönderdi; büyüyü başlatan oydu.","cevap":"Kendisi büyü yapmadı; yasını, cevap vereceğini sandığı birine taşıdı. Bu umutsuzluk, cadılık değil."},{"iddia":"Rebecca'yı kıskançlıktan suçladı.","cevap":"Act 1'de acısını açıkça dile getirir; yas ve öfke kötü niyetle aynı şey değildir, idamı mahkeme kararlaştırdı."},{"iddia":"Act 1'de Goody Osburn'ü de hedef gösterdi.","cevap":"Osburn onun ebesiydi; aynı yas mantığıyla kaybının sebebini arıyordu."}],"kontrol":["✔ Yedi bebek doğdukları GECE öldü (Act 1); SPEC'teki \"doğduğu gün\" kabul edilebilir.","⚠ Oyunda Ann'in Rebecca'yı mahkemede suçladığı sahne yok. Act 2'de Francis tutuklama emrini okur (Putnam bebeklerinin doğaüstü ölümü); Ann'in sonradan Rebecca'yı suçladığı bilgisi Miller'ın Act 1 anlatıcı notundadır (tarihî bilgi). \"Suçlama Putnam bebekleriyle ilgiliydi\" de; Ann'in mahkemede ne dediğini uydurma.","⚠ LitCharts ve GradeSaver, Rebecca'nın Putnam doğumlarında ebe olduğunu yazar; oyunda bu YOK. Act 1'de Ann ebenin Goody Osburn olduğunu (üç doğumda) söyler. Kullanma.","✔ Toprak hırsının Thomas'a ait olduğu Act 3'teki Giles ifadesiyle uyumlu."],"kaynaklar":["Shmoop – Mrs. Ann Putnam","CliffsNotes – Act I Scene 4 Summary and Analysis","eNotes – The Crucible questions on Ann Putnam","LitCharts – The Crucible: Characters","GradeSaver – The Crucible Character List"]},"Tituba":{"motivasyon":["Hayatta kalmak: Parris'in Barbados'tan getirdiği köle; evde her şeyden o sorumlu tutulur ve Parris'ten korkar; Salem toplumunun en alt basamağıdır (LitCharts).","İtiraf etmenin kurtulmanın en kesin yolu olduğunu görünce başkalarının adını verir (GradeSaver).","Kendi şarkı ve ritüellerini kötülük olarak görmez; yorumcular yargılanmasında önyargının ve ırkçılığın büyük payı olduğunu söyler (Shmoop)."],"savunma":["Act 1: Önce Abigail, sorgudan kurtulmak için suçu Tituba'ya atar (ona kan içirdiğini iddia eder); Tituba ise asıl büyüyü Abigail'in istediğini söyler. İlk suçlayan Abigail'dir.","Act 1: Parris onu ölene kadar kırbaçlamakla, Putnam asılmakla tehdit eder; Tituba dizlerinin üstüne çöker. Bu itiraf korkuyla alınmıştır.","Act 1: Sarah Good ve Osburn adlarını önce Thomas Putnam söyler; Hale \"seni koruyacağız\" diyerek kim olduklarını sorar. İsimler ona dikte edilmiştir.","Act 1: Ruth'u ona Ann Putnam gönderdi; köle olan Tituba'nın efendisinin yeğenine ve bir köy ileri gelenine hayır deme imkânı yoktu."],"savci":[{"iddia":"Ormanda büyü yaptı ve itiraf etti.","cevap":"İtiraf kırbaç ve idam tehdidi altında alındı; böyle bir itiraf delil değildir."},{"iddia":"İki masum kadını ele verdi.","cevap":"İsimleri ona Putnam önerdi, Hale koruma vaadiyle istedi; Tituba yalnızca tekrarladı."}],"kontrol":["✔ Parris'in kırbaç, Putnam'ın asma tehdidi, Hale'in koruma vaadi ve Abigail'in Tituba'yı ilk suçlaması Act 1 metninde var.","⚠ SPEC'te \"Hale isimleri sordu\" yazıyor, doğru; ama isimleri ilk ağzına alan Thomas Putnam'dır. Bunu ekle, savunman güçlenir.","✔ \"Abigail tılsım için yalvardı\": Tituba bunu Act 1'de söyler; Betty de Abigail'in tılsım içtiğini açıklar.","⚠ Irkçılık bir yorumcu görüşüdür (Shmoop); oyunda açıkça söylenmez. \"Bazı yorumculara göre\" diye kullan. Act 4'teki hücre sahnesinden sonra akıbeti belirsizdir; uydurma."],"kaynaklar":["LitCharts – The Crucible: Characters","GradeSaver – The Crucible Character List","Shmoop – Tituba","EBSCO Research Starters – The Crucible: Analysis of Major Characters","Wikipedia – The Crucible"]},"Betty Parris":{"motivasyon":["Ceza korkusu: dans ortaya çıkınca babasından ve köyden korkup kendinden geçer; bazı yorumlar bunu korku, bazıları numara olarak okur (eNotes, Shmoop).","Abigail'in liderliğini izleyen bir takipçi; Abigail'in planına hızla uyar (LitCharts)."],"savunma":["Act 1 sahne notu: Betty on yaşında bir çocuktur.","Act 1: Abigail, kızlardan biri konuşursa gece gelip korkunç bir intikam alacağını söyleyerek tehdit eder ve ailesinin gözü önünde öldürüldüğünü anlatır. Betty'nin felci korkunun kanıtıdır.","Act 1: Betty, Abigail'in Proctor'un karısını öldürmek için tılsım içtiğini açığa vurur. Abigail'in asıl niyetini ilk ortaya koyan odur.","Act 1 sonu: İsim sayma, Tituba tehditle konuşturulduktan ve Abigail isim saymaya başladıktan sonra, yetişkinlerin teşvikiyle olur; 10 yaşındaki bir çocuk ortamı taklit eder."],"savci":[{"iddia":"Act 1 sonunda masum insanları (George Jacobs, Goody Howe) suçladı.","cevap":"Yetişkinlerin tehdit ve coşkuyla yönettiği bir odada 10 yaşındaki bir çocuk; sorumluluk yetişkinlerindir."},{"iddia":"Hastalığı numaraydı.","cevap":"Numara bile olsa sebebi korkudur; bir çocuğun korkusu suç değildir."}],"kontrol":["✔ 10 yaş Act 1 sahne notunda. ⚠ LitCharts ve GradeSaver Betty'yi \"ergen (teenage)\" diye tanıtır; bu oyunla çelişir, 10 kullan.","✔ Abigail'in tehdidi ve Betty'nin tılsım açıklaması Act 1'de.","⚠ \"Gerçeği ilk söyleyen\" tartışmalı: Act 1'de Mary Warren, Betty'den önce Abigail'e gerçeği söylemeleri gerektiğini söyler. Daha güvenli ifade: \"Abigail'in tılsımını ilk açığa vuran\".","⚠ Betty'nin Act 1 sonunda isim verdiği metinde açıkça var; inkâr etme, hafiflet."],"kaynaklar":["Shmoop – Betty Parris","eNotes – How are Betty's and Ruth's symptoms similar?","LitCharts – The Crucible: Characters","Wikipedia – The Crucible"]},"Abigail Williams":{"motivasyon":["Kendini koruma: dans ve büyü ortaya çıkınca cezadan kaçmak için suçu başkalarına atar (LitCharts, GradeSaver).","Proctor'a tutku: onu evden kovan Elizabeth'in yerini almak ister (GradeSaver, LitCharts).","Yorumculara göre çocuklukta yaşadığı travma (ailesinin öldürülmesi) ve yetimlik sertliğini kısmen açıklar (GradeSaver)."],"savunma":["Act 1: 17 yaşında bir yetimdir, amcası Parris'in yanında yaşar; ailesinin yanındaki yastıkta öldürüldüğünü gördüğünü anlatır.","Act 1 Proctor sahnesi + Act 3 Proctor'un itirafı: evli ve yaşça büyük işvereni Proctor ilişkiyi mahkemede kabul eder; ilişki Abigail'in kovulmasıyla biter. Güç dengesizliği ve yetişkinin sorumluluğu.","Act 1: Parris onu sorgular, Hale gelince cadılık şüphesi doğrudan ona yönelir; Abigail ancak suçu Tituba'ya atınca sorgudan kurtulur. Suçlama bir hayatta kalma tepkisidir.","Act 2-3: Mahkeme ve yetişkinler maddi kanıt istemeden ona inandı; ona gücü Danforth ve mahkeme verdi."],"savci":[{"iddia":"Elizabeth'e iğneli bebekle tuzak kurdu, Act 3'te kuş sahnesiyle Mary'yi çökertti.","cevap":"İnkâr etmiyoruz; ama 17 yaşındaki bir kızın sözünü kanıt sayan mahkemenin sorumluluğu daha büyüktür."},{"iddia":"Act 4'te amcasının parasını çalıp kaçtı; suçlu olduğunu biliyordu.","cevap":"Korkudan kaçtı; bunu kabul ediyoruz ve hafifletme istiyoruz, inkâr değil."},{"iddia":"Act 1'de diğer kızları tehdit etti.","cevap":"Köşeye sıkışmış bir gencin panik tepkisi; kabul et ve korku temasına bağla."}],"kontrol":["✔ 17 yaş, yetim, ailesinin öldürülüşü (Act 1), Proctor ilişkisi, Act 3 itiraf, Act 4'te parayla kaçış metinle uyumlu.","⚠ Aile hikâyesini Abigail, Act 1'de kızları TEHDİT ederken anlatır. Savcı bu bağlamı kullanır; sahneyi dürüstçe, tehdit kısmıyla birlikte an.","⚠ Wikipedia'daki \"gerçek Abigail 11-12 yaşındaydı\" bilgisi tarihseldir; oyunda 17. Kullanma.","✔ İğne: Act 3'teki ifadeye göre Abigail mahkemede Mary'nin yanında oturup bebeği yapışını ve iğneyi takışını görmüştür; suçlamanın dayanağı bu."],"kaynaklar":["LitCharts – Abigail Williams Character Analysis","GradeSaver – The Crucible Character List","EBSC function confetti(n=70){if(RM)return;const cols=['#e2b746','#c99a2e','#8d4e27','#f6e2b6','#2c7a4b','#b0362a'];for(let i=0;i<n;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=rnd(cols);c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000);}}

function nightEl(){const p=S.plan;if(!p.start)return 0;return (p.pausedAt||Date.now())-p.start-p.acc;}
function nightStep(el){let a=0;for(let i=0;i<4;i++){a+=STEPS[i].min*60000;if(el<a)return{i,left:a-el};}return{i:4,left:0};}
function buildPlanbar(){$('#planbar').innerHTML=STEPS.slice(0,4).map((s,i)=>`<button class="seg" style="--w:${s.min}" data-go="${s.v}" title="${esc(s.t)} · ${s.min} dk" aria-label="${esc(s.t)}"><i></i></button>`).join('');}
function updNight(){
const p=S.plan,el=nightEl(),run=p.start&&!p.pausedAt;
$('#nightTime').textContent=fmt(el,true);
const b=$('#nightBtn');b.innerHTML=run?ICON.pause:ICON.play;b.setAttribute('aria-label',run?'Gece sayacını duraklat':'Gece sayacını başlat');
let lbl;
if(!p.start)lbl='Gece planı · 3 saat · başlat';
else{const st=nightStep(el);lbl=st.i<4?`${st.i+1}/4 ${STEPS[st.i].t} · ${fmt(st.left)} kaldı`:'Gece bitti · sabah kartı';if(p.pausedAt)lbl='Duraklatıldı · '+lbl;
if(st.i!==p.lastStep){if(p.lastStep>=0&&run){const nx=STEPS[st.i];toast(`Süre doldu → sıradaki: ${nx.t}`,'Git',()=>go(nx.v));}p.lastStep=st.i;save();}}
$('#nightStep').textContent=lbl;
let acc=0;$$('#planbar .seg').forEach((sg,i)=>{const len=STEPS[i].min*60000;const f=Math.min(1,Math.max(0,(el-acc)/len));sg.firstChild.style.width=(f*100)+'%';sg.classList.toggle('cur',!!p.start&&el>=acc&&el<acc+len);acc+=len;});
}

function tezOf(id){if(!S.tez[id])S.tez[id]={thesis:'',q:Array.from({length:6},()=>({p:'',t:''})),aw:{}};return S.tez[id];}
const thesisOk=t=>{t=(t||'').trim();return !/_{2,}|…|\.\.\./.test(t)&&t.split(/\s+/).filter(Boolean).length>=18&&/\bnot guilty\b/i.test(t)&&/\bbecause\b/i.test(t);};
const quoteOk=q=>!!q&&/^\d{1,3}(\s*[-–]\s*\d{1,3})?$/.test(String(q.p).trim())&&parseInt(q.p,10)>0&&String(q.t).trim().length>=3;
const pageOk=v=>{v=String(v==null?'':v).trim();return /^\d{1,3}(\s*[-–]\s*\d{1,3})?$/.test(v)&&parseInt(v,10)>0;};
function prepZ(c,z){if(!z.pg)z.pg={};if(!z.qt)z.qt={};const all=evAll(c);
if(!z.v2){for(let k=0;k<3;k++){all.filter(e=>e.arg===k+1).slice(0,2).forEach((e,r)=>{const q=z.q[k*2+r];if(!q)return;const pv=String(q.p||'').trim(),tv=String(q.t||'').trim();if(pv&&z.pg[e.find]===undefined)z.pg[e.find]=pv;if(tv&&tv!==e.find&&!z.qt[e.find])z.qt[e.find]=tv;});}
if(z.x)for(const i in z.x){const e=all[+i];if(e&&String(z.x[i]).trim()&&z.pg[e.find]===undefined)z.pg[e.find]=String(z.x[i]).trim();}z.v2=1;}
all.forEach(e=>{if(e.bookPageSource==='foto'&&e.bookPage!=null&&z.pg[e.find]===undefined)z.pg[e.find]=String(e.bookPage);});}
function ensureAll(){CH.forEach(c=>prepZ(c,tezOf(c.id)));}
function recheckReady(){let ch=false;CH.forEach(c=>{const z=S.tez[c.id];if(!z)return;const aw=z.aw||(z.aw={});if(!tezProg(c.id).ready){if(aw.ready){aw.readyXP=1;aw.ready=0;ch=true;}if(S.badges['case-'+c.id]){delete S.badges['case-'+c.id];ch=true;}}else if(aw.ready)aw.readyXP=1;});
if(readyCount()<11){if(S.badges.all){delete S.badges.all;ch=true;}if(S.finalShown){S.finalShown=false;ch=true;}}if(ch)save();}
function tezProg(id){const z=S.tez[id];if(!z)return{th:false,qn:0,ready:false,pct:0};const c=CH[CHI[id]];prepZ(c,z);const th=thesisOk(z.thesis);let qn=0;
for(let k=0;k<3;k++){const evs=argEv(c,k);let f=evs.filter(e=>pageOk(z.pg[e.find])).length;for(let r=evs.length;r<2;r++)if(quoteOk(z.q[k*2+r]))f++;qn+=Math.min(2,f);}
return{th,qn,ready:th&&qn===6,pct:((th?1:0)+qn)/7};}
const readyCount=()=>CH.filter(c=>tezProg(c.id).ready).length;
const goldCount=()=>SL.filter((s,i)=>(S.formula.stats[i]||{}).lvl>=3).length;

function toks(s){
s=String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/s\/he|she\/he|he\/she/g,'she').replace(/him\/her|her\/him/g,'her').replace(/_+/g,' ').replace(/'/g,'').replace(/[^a-z0-9*]+/g,' ').trim();
if(!s)return[];
return s.split(/\s+/).filter(w=>w&&!/^\d+$/.test(w)).map(w=>w==='he'?'she':(w==='him'||w==='his')?'her':w==='an'?'a':w);
}
const tplToks=t=>toks(t.replace(/\{N\}|_{2,}/g,' * '));
function matchTpl(tpl,text){const t=tplToks(tpl),u=toks(String(text).replace(/\*/g,' '));if(!u.length)return false;const re=new RegExp('^'+t.map(x=>x==='*'?'(?:\\S+ )*?':escRe(x)+' ').join('')+'$');return re.test(u.join(' ')+' ');}
function missingIdx(tpl,text){const f=tplToks(tpl).filter(x=>x!=='*'),u=toks(text);const n=f.length,m=u.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=f[i]===u[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);const miss=new Set();let i=0,j=0;while(i<n){if(j<m&&f[i]===u[j]){i++;j++;}else if(j<m&&L[i][j+1]>=L[i+1][j])j++;else{miss.add(i);i++;}}return miss;}
function splitW(w){const m=w.match(/^([^A-Za-z{_]*)([A-Za-z{}_]*)(.*)$/);return{pre:m[1],core:m[2],post:m[3]};}
function tplMarked(tpl,miss){let fi=0;return tpl.split(' ').map(w=>{const {core}=splitW(w);const tk=toks(core.replace(/\{N\}|_{2,}/g,''));let mk=false;tk.forEach(()=>{if(miss.has(fi))mk=true;fi++;});const h=tplHTML(w);return mk?'<mark>'+h+'</mark>':h;}).join(' ');}
const STOP=new Set(['the','and','that','you','her','she','his','but','of','my','is','it','to','a']);
function pickBlanks(tpl){const ws=tpl.split(' ');let c=[];ws.forEach((w,i)=>{const {core}=splitW(w);if(/^[A-Za-z]{3,}$/.test(core)&&!STOP.has(core.toLowerCase()))c.push(i);});if(!c.length)ws.forEach((w,i)=>{if(/^[A-Za-z]+$/.test(splitW(w).core))c.push(i);});const k=Math.min(3,Math.ceil(c.length/2));return shuffle(c.slice()).slice(0,k).sort((a,b)=>a-b);}
function buildQueue(){const q=[];[[0,4],[4,19],[19,25]].forEach(([a,b])=>{for(let s=a;s<b;s++)q.push([s,1]);for(let s=a;s<b;s++)q.push([s,2]);});shuffle([...Array(25).keys()]).forEach(s=>q.push([s,3]));return q;}
const STAGE=['','Aşama 1 · Boşlukları doldur','Aşama 2 · Tüm cümle','Aşama 3 · Numaradan hatırla'];
function F(){const f=S.formula;if(!f.queue)f.queue=buildQueue();if(!f.v2){[10,11,12,13,15,16,17,18].forEach(i=>{delete f.stats[i];});if(f.cur&&[10,11,12,13,15,16,17,18].includes(f.cur.s))f.cur=null;f.v2=1;save();}return f;}
function nextQ(){const f=F();let s,st;if(f.qi<f.queue.length){[s,st]=f.queue[f.qi];}else{f.doneAll=true;const w=SL.map((_,i)=>{const x=f.stats[i]||{};return 1+(x.bad||0)*2+((x.lvl||0)<3?4:0);});let r=Math.random()*w.reduce((a,b)=>a+b,0);s=0;for(;s<24;s++){r-=w[s];if(r<=0)break;}st=3;}
f.cur={s,st,blanks:st===1?pickBlanks(SL[s].tpl):[],wrong:false,fb:null};save();}
let fLock=false;
function jumpTo(s){const f=F();s=Math.max(0,Math.min(24,s|0));const lv=(f.stats[s]||{}).lvl||0;const st=Math.min(3,lv+1);
if(st===3){const start=f.queue.findIndex(x=>x[1]===3);const tail=[];for(let k=0;k<25;k++)tail.push([(s+k)%25,3]);f.queue=f.queue.slice(0,start).concat(tail);f.qi=start;}
else f.qi=f.queue.findIndex(x=>x[0]===s&&x[1]===st);
f.cur=null;f.doneAll=false;f.pendingBreak=false;f.breakStart=null;save();if(S.view==='formul')RENDER.formul();else go('formul');toast('Slot '+(s+1)+'\'den devam (Aşama '+st+').');}

function checkF(){
if(fLock)return;const f=F(),c=f.cur,sl=SL[c.s];let ok,user='',miss=new Set(),extra='';
if(c.st===1){const ins=$$('#qcard input.bl');if(ins.some(i=>!i.value.trim())){const e=ins.find(i=>!i.value.trim());e.focus();e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),400);return;}
const ws=sl.tpl.split(' ');ok=true;const wrongWords=[];
ins.forEach(inp=>{const w=splitW(ws[+inp.dataset.i]).core;const good=toks(inp.value).join(' ')===toks(w).join(' ');inp.classList.add(good?'ok':'bad');if(!good){ok=false;wrongWords.push(+inp.dataset.i);}});
user=ins.map(i=>i.value.trim()).join(' · ');
// build miss set by fixed-token index of wrong words
let fi=0;ws.forEach((w,i)=>{const tk=toks(splitW(w).core.replace(/\{N\}|_{2,}/g,''));tk.forEach(()=>{if(wrongWords.includes(i))miss.add(fi);fi++;});});
}else{const v=$('#qin').value;if(!v.trim()){$('#qin').focus();return;}user=v.trim();ok=matchTpl(sl.tpl,v);if(!ok)miss=missingIdx(sl.tpl,v);
if([8,13,18].includes(c.s)&&!/\?\s*["'”’)]*\s*$/.test(v.trim())){if(ok)extra='Soru işareti eksik: retorik soru "?" ile bitmeli, yoksa sayılmaz.';else extra='Ayrıca cümle "?" ile bitmeli.';ok=false;}}
f.answered++;f.since++;const st=f.stats[c.s]||(f.stats[c.s]={ok:0,bad:0,lvl:0});
if(ok){st.ok++;const gain=c.wrong?3:[0,5,10,15][c.st];if(c.st>(st.lvl||0)&&!c.wrong)st.lvl=c.st;else if(c.wrong&&c.st>(st.lvl||0)&&c.st<3)st.lvl=c.st;
f.streak++;f.best=Math.max(f.best,f.streak);if(f.streak>=10)badge('streak10');badge('first');
addXP(gain);if(f.qi<f.queue.length)f.qi++;f.cur=null;if(f.since>=15)f.pendingBreak=true;

const b=$('#qcheck');if(b)b.disabled=true;
setTimeout(()=>{fLock=false;if(S.view==='formul')RENDER.formul();},RM?150:750);
}else{st.bad++;f.streak=0;c.wrong=true;c.fb={user,miss:[...miss],extra,vals:c.st===1?$$('#qcard input.bl').map(i=>[i.value,i.classList.contains('ok')]):null};save();RENDER.formul();const card=$('#qcard');card.classList.add('shake');}
}

function makeWheel(host,getReady){
const n=CH.length,step=360/n,R=140;let rot=0,busy=false;
const segs=CH.map((c,i)=>{const a0=(i*step-90)*Math.PI/180,a1=((i+1)*step-90)*Math.PI/180;const p=`M0 0 L${(R*Math.cos(a0)).toFixed(2)} ${(R*Math.sin(a0)).toFixed(2)} A${R} ${R} 0 0 1 ${(R*Math.cos(a1)).toFixed(2)} ${(R*Math.sin(a1)).toFixed(2)}Z`;const cdeg=(i+.5)*step;
return `<path class="segp s${i%3+1}" data-i="${i}" d="${p}"/>${cdeg>180?`<g transform="rotate(${(cdeg+90).toFixed(2)})"><text x="-40" y="0" text-anchor="end" data-t="${i}">${esc(c.short)}</text></g>`:`<g transform="rotate(${(cdeg-90).toFixed(2)})"><text x="40" y="0" data-t="${i}">${esc(c.short)}</text></g>`}`;}).join('');
const studs=Array.from({length:22},(_,k)=>{const a=k*(360/22)*Math.PI/180;return `<circle class="stud" cx="${(146*Math.cos(a)).toFixed(1)}" cy="${(146*Math.sin(a)).toFixed(1)}" r="2.2"/>`;}).join('');
host.innerHTML=`<div class="wheelwrap"><svg class="wheel" viewBox="-156 -162 312 318" role="img" aria-label="Kura çarkı"><circle r="150" fill="#3b1f0f"/><g class="wrot">${segs}</g><circle class="rim" r="146"/><circle class="rim2" r="141"/>${studs}<circle class="hub" r="30"/><g transform="translate(-17 -17) scale(.53)" style="color:#e2b746">${ICON.gavel.replace('class="gavel"','width="64" height="64"')}</g><path class="ptr" d="M-13 -160 L13 -160 L0 -134 Z"/></svg><div class="court"><div><small>ALL RISE</small><span>Court is now in session</span></div></div></div>`;
const g=host.querySelector('.wrot'),court=host.querySelector('.court');
function mark(){const rd=getReady();host.querySelectorAll('.segp').forEach(p=>p.classList.toggle('ready',rd.includes(CH[+p.dataset.i].id)));host.querySelectorAll('text[data-t]').forEach(t=>{const c=CH[+t.dataset.t];t.textContent=(rd.includes(c.id)?'✓ ':'')+c.short;});}
mark();
return{mark,busy:()=>busy,spin(i,cb){if(busy)return;busy=true;const cdeg=(i+.5)*step,j=(Math.random()-.5)*step*.6;const cur=((rot%360)+360)%360;const target=rot+360*5+((((-cdeg+j)-cur)%360)+360)%360;const from=rot,dur=RM?300:4200,t0=performance.now();court.querySelector('span').textContent='Court is now in session';court.querySelector('small').textContent='ALL RISE';court.classList.add('on');
const ease=t=>1-Math.pow(1-t,4);
function fr(now){const t=Math.min(1,(now-t0)/dur);rot=from+(target-from)*ease(t);g.setAttribute('transform',`rotate(${rot.toFixed(2)})`);if(t<1)requestAnimationFrame(fr);else{busy=false;court.querySelector('small').textContent='THE COURT CALLS';court.querySelector('span').textContent=CH[i].name;setTimeout(()=>court.classList.remove('on'),1600);cb&&cb(i);}}
requestAnimationFrame(fr);}};
}
