function ringSVG(p){const C=2*Math.PI*11;return `<svg class="pr" viewBox="0 0 28 28"><circle class="bg" cx="14" cy="14" r="11"/><circle class="fg" cx="14" cy="14" r="11" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}"/></svg>`;}
function charGrid(){return CHO.map(c=>{const p=tezProg(c.id);return `<button class="cbtn ${p.ready?'ready':''} ${S.tezSel===c.id?'sel':''}" data-c="${c.id}">${ringSVG(p.pct)}<span>${esc(c.short)}<small>${p.ready?'Dava hazır':(p.th?'Tez ✓':'Tez —')+' · '+p.qn+'/6'}</small></span></button>`;}).join('');}
RENDER.tez=function(){ensureAll();
const rc=readyCount();
$('#v-tez').innerHTML=`
<div class="row"><div><div class="eyebrow">Mod 2 · 75 dk · karakter başı ~7 dk</div><h2 class="h2">Tez fabrikası</h2></div><div class="sp"></div><span class="chip ${rc===11?'ok':'brass'}" id="tezCount">Dava hazır ${rc}/11</span></div>
<div class="bar" style="margin:10px 0 14px"><i id="tezBar" style="width:${rc/11*100}%"></i></div>
<div class="tezlayout">
<div class="card"><div id="wheelHost"></div>
<div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" id="spinBtn">Çarkı çevir</button></div>
<p class="tiny muted" style="text-align:center;margin:8px 0 0">Çark <b>hazır olmayan</b> karakterlerden en kolayını seçer (soluk + ✓ olanlar hazır). Hepsi hazırsa rastgele.</p>
<hr class="rule"><div class="tiny muted" style="margin-bottom:6px"><b>Kolaydan zora:</b> ${CHO.map(c=>esc(c.short)).join(' → ')}</div><div class="chars" id="charGrid">${charGrid()}</div>
<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn sm danger" id="tezReset">Tez fabrikasını sıfırla</button></div></div>
<div id="dossier">${S.tezSel?dossierHTML(S.tezSel):`<div class="card" style="text-align:center;padding:40px 18px"><div class="gavel" style="width:64px;margin:0 auto 8px">${ICON.gavel}</div><h3 class="h2">Mahkeme toplanıyor</h3><p class="muted">Çarkı çevir ya da soldan bir karakter seç. Dosya açılınca: (a) tez cümlesi, (b) her argüman için kitaptan 2 sayfa numarası + kısa alıntı. İkisi tamamlanınca <b>Dava hazır</b> damgası.</p></div>`}</div>
</div>`;
tezWheel=makeWheel($('#wheelHost'),()=>CH.filter(c=>tezProg(c.id).ready).map(c=>c.id));
$('#spinBtn').onclick=()=>{if(tezWheel.busy())return;const i=pickTez();$('#spinBtn').disabled=true;tezWheel.spin(i,()=>{$('#spinBtn').disabled=false;S.tezTimer={id:CH[i].id,start:Date.now()};openDossier(CH[i].id,true);});};
$('#charGrid').onclick=e=>{const b=e.target.closest('[data-c]');if(b)openDossier(b.dataset.c);};
$('#tezReset').onclick=()=>{if(confirm('Tüm tez ve alıntılar silinsin mi? (Bu geri alınamaz.)')){S.tez={};S.tezSel=null;S.tezTimer=null;save();RENDER.tez();}};
if(S.tezSel)bindDossier(S.tezSel);
};
function openDossier(id,fromWheel){S.tezSel=id;save();$('#dossier').innerHTML=dossierHTML(id);bindDossier(id);$('#charGrid').innerHTML=charGrid();const d=$('#dossier');if(innerWidth<900&&d.scrollIntoView)d.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});if(fromWheel)strike($('#dossier .gavel'));}
const KN=(window.KANIT&&window.KANIT.characters)||{};
const KNOTE=(window.KANIT&&window.KANIT.note)||'';
function evAll(c){return (KN[c.name]||[]).map((e,i)=>Object.assign({i},e));}
const actRank=e=>/One|Two/.test(e.act)?0:1;
const bySort=a=>a.map((e,j)=>[e,j]).sort((x,y)=>actRank(x[0])-actRank(y[0])||x[1]-y[1]).map(x=>x[0]);
function argEv(c,k){return bySort(evAll(c).filter(e=>e.arg===k+1));}
const bookRef=e=>e.bookPage==null?'':(e.bookPageSource==='foto'?'Kitap s. '+e.bookPage:'Kitap ≈ s. '+e.bookPage);
function extraEv(c){return bySort(evAll(c).filter(e=>typeof e.arg!=='number'));}
const EVLBL={dikkat:'Dikkat · savcının kozu',pathos:'Pathos'};
function evLbl(e){return typeof e.arg==='number'?'Argüman '+e.arg+' (fazladan)':(EVLBL[e.arg]||String(e.arg));}
function analizFor(c){const A=window.ANALIZ;if(!A||typeof A!=='object')return null;const src=A.characters||A;return src[c.name]||src[c.id]||src[c.short]||null;}
function anyHTML(v){if(v==null)return'';if(typeof v!=='object')return '<p class="small" style="margin:4px 0">'+esc(v)+'</p>';if(Array.isArray(v))return '<ul class="small" style="margin:4px 0;padding-left:18px">'+v.map(x=>'<li>'+(x&&typeof x==='object'?anyHTML(x):esc(x))+'</li>').join('')+'</ul>';return Object.entries(v).map(([k,x])=>'<div style="margin-top:6px"><div class="eyebrow" style="font-size:10px">'+esc(k)+'</div>'+anyHTML(x)+'</div>').join('');}
const ANL={motivasyon:'Motivasyon',savunma:'Savunma dayanakları',savci:'Savcı ne diyecek → cevabın',kontrol:'Kontrol (metinle doğrulama)',kaynaklar:'Kaynaklar'};
function analizHTML(an){if(typeof an!=='object'||Array.isArray(an))return anyHTML(an);return Object.entries(an).map(([k,v])=>{let body;
if(k==='savci'&&Array.isArray(v))body='<ul class="small" style="margin:4px 0;padding-left:18px">'+v.map(x=>x&&typeof x==='object'?`<li><b>Savcı:</b> ${esc(x.iddia)}<br><b>Cevap:</b> ${esc(x.cevap)}</li>`:'<li>'+esc(x)+'</li>').join('')+'</ul>';
else if(k==='kaynaklar'&&Array.isArray(v))body='<div class="tiny muted">'+v.map(x=>x&&typeof x==='object'?esc(x.title||x.url):esc(x)).join(' · ')+'</div>';
else if(Array.isArray(v))body='<ul class="small" style="margin:4px 0;padding-left:18px">'+v.map(x=>typeof x==='string'&&/^\s*⚠/.test(x)?`<li class="warnbox" style="list-style:none;margin-left:-18px">${esc(x)}</li>`:'<li>'+(x&&typeof x==='object'?anyHTML(x):esc(x))+'</li>').join('')+'</ul>';
else body=anyHTML(v);
return `<div style="margin-top:8px"><div class="eyebrow" style="font-size:10.5px">${esc(ANL[k]||k)}</div>${body}</div>`;}).join('');}
function evRow(z,e){const v=z.pg[e.find]||'',ok=pageOk(v);return `<div class="qrow"><div class="pg"><input inputmode="numeric" data-ep="${e.i}" value="${esc(v)}" placeholder="${e.bookPage!=null&&e.bookPageSource!=='foto'?'≈'+esc(e.bookPage):'kitabım'}" aria-label="Kitabımdaki sayfa: ${esc(e.find)}"></div><input data-et="${e.i}" value="${esc(z.qt[e.find]||'')}" placeholder="${esc(e.find)}" aria-label="Kısa alıntı / not"><span class="st ${ok?'ok':''}" data-st2="${e.i}">${ok?'✓':'·'}</span></div>`;}
function evBox(e,inner){return `<div class="ev"><div class="evh">${e.bookPage!=null?`<span class="chip ${e.bookPageSource==='foto'?'brass':'warn'}" title="${e.bookPageSource==='foto'?'Kitabının fotoğrafından: kesin':'Tahmin: ±2 sayfa'}">${esc(bookRef(e))}</span>`:''}<span class="tiny muted">${esc(e.act)} · PDF s.${esc(e.pdfPage)} · ${esc(e.who)}</span></div>
<div class="find">Kitabında ara: <span class="mono">“${esc(e.find)}”</span></div>
<div class="small">${esc(e.what)}</div>
<div class="use"><span class="tiny muted">Cümle başlangıcı:</span> ${esc(e.use)}</div>
${e.warning?`<div class="warnbox"><b>UYARI:</b> ${esc(e.warning)}</div>`:''}${inner}</div>`;}
function dossierHTML(id){const c=CH[CHI[id]],z=tezOf(id);prepZ(c,z);const p=tezProg(id),ex=extraEv(c),an=analizFor(c);if(!z.x)z.x={};
const corTag='<span class="cortag" title="SPEC metni oyunla karşılaştırılıp düzeltildi">metne göre düzeltildi</span>';
return `<div class="card dossier" id="dcard">
${p.ready?'<div class="stamp">DAVA HAZIR</div>':''}
<div class="row" style="gap:10px;padding-right:110px"><div class="gavel" style="width:34px">${ICON.gavel}</div><div><div class="eyebrow">Dosya · ${esc(c.he?'he/him':'she/her')}</div><h3 class="h2">${esc(c.name)}</h3></div></div>
<div class="row" style="margin-top:6px"><span class="chip" id="dStat">${statTxt(p)}</span>${S.tezTimer&&S.tezTimer.id===id?'<span class="chip timerchip" id="tezTimer">7:00</span>':''}</div>
<ol class="small guide"><li><b>Tezi yaz:</b> 3 boşluğa aşağıdaki 3 argümanı kendi cümlenle yaz.</li><li><b>Her kanıtta</b> "Kitap s. X" sayfasını aç, tırnaktaki ifadeyi bul, altını çiz (sayfa yanlışsa kutuyu düzelt).</li><li><b>İkisi bitince</b> "Dava hazır" → çarkı yeniden çevir.</li></ol>
<div class="acc"><div class="eyebrow" style="color:var(--bad)">Suçlama (misconduct)</div>${TEZ[id]?`<span lang="en">${esc(TEZ[id].acc)}</span><div class="tiny muted" style="margin-top:3px">SPEC: ${esc(c.acc)}</div>`:esc(c.acc)}</div>
${TEZ[id]?`<div class="readyth"><div class="eyebrow">Hazır tez (kolay İngilizce)</div><div lang="en" style="margin:4px 0 6px">${esc(TEZ[id].th)}</div>${TEZ[id].n?`<div class="tiny" style="color:var(--warn);margin-bottom:6px">${esc(TEZ[id].n)}</div>`:''}<button class="btn sm pri" id="useTh">Bu tezi kullan</button> <span class="tiny muted">Tez kutusuna kopyalar; sonra kendi kelimelerinle değiştirebilirsin.</span></div>`:''}
<div class="small muted"><b>Kitapta bul:</b> ${esc(c.find)}</div>
${c.note?`<div class="note"><b>${esc(c.note[0])}:</b> ${esc(c.note[1])} ${c.noteCor?corTag:''}</div>`:''}
${KNOTE?`<details class="pdfnote"><summary class="small">PDF sayfası ≠ senin kitabın (≈7–10 sayfa fark). Nasıl kullanılır?</summary><p class="small muted" style="margin:6px 0 0">${esc(KNOTE)}</p></details>`:''}
<div style="margin-top:14px"><label for="thIn" class="eyebrow">(a) Tez cümlesi · slot 4</label>
<div class="tpl tiny muted" style="margin:2px 0 6px">${esc(tplFor(SL[3].tpl,c))}</div>
<textarea id="thIn" rows="3" placeholder="${esc(c.name)} is not guilty, because (1) …, (2) …, and (3) …">${esc(z.thesis)}</textarea>
<div class="row" style="margin-top:6px"><button class="btn sm" id="thTpl">Kalıbı ekle</button><span class="tiny muted" id="thHint">Tamam sayılır: "___" / "…" kalmamış, "not guilty" + "because" içeriyor, en az 18 kelime.</span></div></div>
<div style="margin-top:14px" class="eyebrow">(b) Her argüman için 2 kanıt: "find" ifadesini kitabında bul, KENDİ kitabının sayfasını yaz</div>
${c.args.map((a,k)=>{const evs=argEv(c,k),fc=Math.min(2,evs.filter(x=>pageOk(z.pg[x.find])).length);return `<div class="arg"><div class="ah"><span class="an">${k+1}</span><div class="small">${esc(a)} ${(c.cor||[]).includes(k)?corTag:''}</div></div><div class="tiny muted" style="margin-top:4px">2 kanıt yeter · <b data-ac="${k}">${fc}/2</b> · kitabının sayfası yazılı olan her kanıt sayılır</div>
${evs.map(e=>evBox(e,evRow(z,e))).join('')}${[0,1].slice(evs.length).map(r=>{const qi=k*2+r,q=z.q[qi];return `<div class="qrow"><div class="pg"><input inputmode="numeric" data-q="${qi}" data-f="p" value="${esc(q.p)}" placeholder="kitabım"></div><input data-q="${qi}" data-f="t" value="${esc(q.t)}" placeholder="Kısa alıntı / yakın açıklama"><span class="st ${quoteOk(q)?'ok':''}" data-st="${qi}">${quoteOk(q)?'✓':r+1}</span></div>`;}).join('')}</div>`;}).join('')}
${ex.length?`<div class="arg"><div class="eyebrow">Dikkat / Pathos kanıtları (6'ya sayılmaz, savunmanı güçlendirir)</div>${ex.map(e=>evBox(Object.assign({},e,{act:evLbl(e)+' · '+e.act}),evRow(z,e))).join('')}</div>`:''}
<p class="tiny muted" style="margin:10px 0 0">Kanıt sayılır: "kitabım s." kutusunda KENDİ kitabının sayfası (1–999). Fotoğraftan kesin bilinen sayfalar (Act 1–2) hazır dolu gelir; "≈" olanlar tahmindir (±2), kitabında bulup yaz. Alıntı kutusu isteğe bağlı (boşsa "find" ifadesi kullanılır). Her şey otomatik kaydedilir.</p>
${an?`<details class="arg"><summary class="eyebrow">Analiz · motivasyon, savunma, savcının kozları</summary>${analizHTML(an)}</details>`:''}
</div>`;}
function statTxt(p){return p.ready?'Tez ✓ · Alıntı 6/6 · hazır':`Tez ${p.th?'✓':'—'} · Alıntı ${p.qn}/6`;}
function bindDossier(id){const z=tezOf(id),c=CH[CHI[id]];const d=$('#dcard');if(!d)return;
const th=$('#thIn');th.addEventListener('input',()=>{z.thesis=th.value;tezChanged(id);});
const ut=$('#useTh');if(ut)ut.onclick=()=>{const r=readyTh(id);if(th.value.trim()&&th.value.trim()!==r&&!confirm('Tez kutusundaki metnin hazır tezle değiştirilsin mi?'))return;th.value=r;z.thesis=r;tezChanged(id);th.focus();};
$('#thTpl').onclick=()=>{if(!th.value.trim()){th.value=tplFor(SL[3].tpl,c);z.thesis=th.value;tezChanged(id);}th.focus();const i=th.value.indexOf('___');if(i>=0)th.setSelectionRange(i,i+3);};
const all=evAll(c);d.addEventListener('input',e=>{const t=e.target;
if(t.dataset.ep!=null){const ev=all[+t.dataset.ep];z.pg[ev.find]=t.value;const ok=pageOk(t.value);const st=d.querySelector(`[data-st2="${t.dataset.ep}"]`);st.classList.toggle('ok',ok);st.textContent=ok?'✓':'·';
if(ok&&typeof ev.arg==='number'){const aw=z.aw||(z.aw={});if(!aw['p'+ev.find]){aw['p'+ev.find]=1;addXP(5);}}
for(let k=0;k<3;k++){const b=d.querySelector(`[data-ac="${k}"]`);if(b)b.textContent=Math.min(2,argEv(c,k).filter(x=>pageOk(z.pg[x.find])).length)+'/2';}tezChanged(id);return;}
if(t.dataset.et!=null){z.qt[all[+t.dataset.et].find]=t.value;save();return;}
if(t.dataset.q==null)return;const qi=+t.dataset.q;z.q[qi][t.dataset.f]=t.value;
const ok=quoteOk(z.q[qi]);const st=d.querySelector(`[data-st="${qi}"]`);st.classList.toggle('ok',ok);st.textContent=ok?'✓':(qi%2+1);tezChanged(id);});
updTezTimer();}
function tezChanged(id){const z=tezOf(id),p=tezProg(id),aw=z.aw||(z.aw={});
if(p.th&&!aw.th){aw.th=1;addXP(20);}
const st=$('#dStat');if(st)st.textContent=statTxt(p);
const d=$('#dcard');if(d){let s=d.querySelector('.stamp');if(p.ready&&!s){d.insertAdjacentHTML('afterbegin','<div class="stamp anim">DAVA HAZIR</div>');}else if(!p.ready&&s)s.remove();}
if(p.ready&&!aw.ready){aw.ready=1;if(!aw.readyXP){aw.readyXP=1;addXP(50);}badge('case-'+id,true);toast('Dava hazır: '+CH[CHI[id]].name+'!');confetti(30);strike($('#dcard .gavel'));}
const rc=readyCount();const cc=$('#tezCount');if(cc){cc.textContent='Dava hazır '+rc+'/11';cc.className='chip '+(rc===11?'ok':'brass');$('#tezBar').style.width=(rc/11*100)+'%';}
const g=$('#charGrid');if(g){const b=g.querySelector(`[data-c="${id}"]`);if(b){const tmp=document.createElement('div');tmp.innerHTML=charGrid();const nb=tmp.querySelector(`[data-c="${id}"]`);b.replaceWith(nb);}}
if(tezWheel)tezWheel.mark();
save();if(rc===11){badge('all');if(!S.finalShown){S.finalShown=true;save();setTimeout(showFinal,900);}}}
function updTezTimer(){const el=$('#tezTimer');if(!el||!S.tezTimer)return;const left=7*60000-(Date.now()-S.tezTimer.start);el.textContent=left>=0?fmt(left)+' hedef':'+'+fmt(-left)+' aşım';el.className='chip timerchip '+(left>=0?'':'warn');}

/* ============ MOLA + QUIZ ============ */
const MOLA=15*60000;
RENDER.mola=function(){
const q=S.quiz;
$('#v-mola').innerHTML=`
<div class="row"><div><div class="eyebrow">Plan adımı 3 · 15 dk</div><h2 class="h2">Mola, sonra ısınma</h2></div></div>
<div class="grid2" style="margin-top:12px">
<div class="card" style="text-align:center"><div class="eyebrow">Mola sayacı</div>
<svg class="ring" viewBox="0 0 140 140" style="width:170px;height:170px"><circle class="bg" cx="70" cy="70" r="60"/><circle class="fg" id="molaRing" cx="70" cy="70" r="60" stroke-dasharray="377" stroke-dashoffset="377"/><text x="70" y="70" id="molaT">15:00</text></svg>
<div class="row" style="justify-content:center"><button class="btn pri" id="molaBtn">${S.mola.start?'Molayı yeniden başlat':'15 dk molayı başlat'}</button></div>
<p class="small muted" style="margin:10px 0 0">Ekrandan uzaklaş, su iç, ayağa kalk. Kafanda 25 slotu bir kez say. Süre bitince aşağıdaki quiz ile ısın.</p></div>
<div class="card"><div class="eyebrow">Hızlı quiz · ısınma</div><p class="small muted" style="margin:4px 0 8px">Karakter → suçlama → argüman eşleştirme. Yanlışta geçmiyoruz: açıklama gelir, aynı soru tekrar sorulur.</p>
<div class="row"><span class="chip">İlk denemede doğru: ${q.ok}/${q.total}</span><span class="chip">En iyi tur ${q.best}/12</span><span class="chip">Tur ${q.rounds}</span></div>
<div id="quizBox" style="margin-top:12px"></div>
<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn sm danger" id="qReset">Quiz istatistiklerini sıfırla</button></div></div>
</div>`;
$('#molaBtn').onclick=()=>{S.mola.start=Date.now();save();updMola();};
$('#qReset').onclick=()=>{if(confirm('Quiz istatistikleri sıfırlansın mı?')){S.quiz=def().quiz;save();RENDER.mola();}};
updMola();renderQuiz();
};
function updMola(){const r=$('#molaRing');if(!r)return;if(!S.mola.start){$('#molaT').textContent='15:00';return;}const left=Math.max(0,MOLA-(Date.now()-S.mola.start));r.style.strokeDashoffset=377*(left/MOLA);$('#molaT').textContent=left?fmt(left):'Bitti';if(!left&&!S.mola.done){S.mola.done=true;addXP(10);badge('rest');toast('Mola bitti: şimdi Hızlı quiz ile ısın.');save();}}
function genRound(){const cs=shuffle(CH.map((c,i)=>i)).slice(0,6),qs=[];cs.forEach(ci=>{qs.push({type:Math.random()<.5?'acc':'who',c:ci});qs.push({type:'arg',c:ci,a:Math.floor(Math.random()*3)});});return qs;}
function genOpts(q){const others=shuffle(CH.map((c,i)=>i).filter(i=>i!==q.c)).slice(0,3);let opts;
if(q.type==='acc')opts=[{t:CH[q.c].acc,ok:1},...others.map(i=>({t:CH[i].acc,ok:0}))];
else if(q.type==='who')opts=[{t:CH[q.c].name,ok:1},...others.map(i=>({t:CH[i].name,ok:0}))];
else opts=[{t:CH[q.c].args[q.a],ok:1},...others.map(i=>({t:CH[i].args[Math.floor(Math.random()*3)],ok:0}))];
return shuffle(opts);}
function qPrompt(q){const c=CH[q.c];if(q.type==='acc')return `<div class="eyebrow">Karakter → suçlama</div><b style="font-size:18px">${esc(c.name)}</b><div class="small muted">Bu karakterin suçlaması hangisi?</div>`;if(q.type==='who')return `<div class="eyebrow">Suçlama → karakter</div><b>“${esc(c.acc)}”</b><div class="small muted">Bu kimin dosyası?</div>`;return `<div class="eyebrow">Suçlama → argüman</div><b>${esc(c.name)}</b><div class="small">Suçlama: ${esc(c.acc)}</div><div class="small muted">Hangisi bu suçlamaya karşı savunma argümanlarından biri?</div>`;}
function qWhy(q){const c=CH[q.c];if(q.type==='arg')return `Bu, ${c.name} dosyasının ${q.a+1}. argümanı. Kitapta bul: ${c.find}.`;return `${c.name}: suçlama “${c.acc}”. Kilit sahne: ${c.find}.`;}
function renderQuiz(){const box=$('#quizBox');if(!box)return;const Q=S.quiz;
if(!Q.cur){box.innerHTML=`<div style="text-align:center;padding:18px 0"><button class="btn pri" id="qStart">12 soruluk tur başlat</button><div class="tiny muted" style="margin-top:6px">Kısayol: 1–4 tuşları</div></div>`;$('#qStart').onclick=()=>{Q.cur={qs:genRound(),i:0,ok:0,wrong:false,opts:null,fb:null};save();renderQuiz();};return;}
const R=Q.cur;if(R.i>=R.qs.length){const best=Math.max(Q.best,R.ok);box.innerHTML=`<div style="text-align:center;padding:10px 0"><div class="scorebig">${R.ok}<small>/12</small></div><p class="muted">ilk denemede doğru. ${R.ok>=10?'Mahkeme etkilendi.':'Bir tur daha: zayıf eşleşmeler güçlensin.'}</p><button class="btn pri" id="qAgain">Yeni tur</button></div>`;$('#qAgain').onclick=()=>{Q.cur=null;save();renderQuiz();$('#qStart').click();};return;}

/* ============ ANALYSIS (Tam prova) ============ */
const CONN_RE=/^\s*["“]?(First|Moreover|Furthermore|Finally|Ultimately|Picture)\b/i,P1_RE=/^\s*["“]?Ladies and gentlemen\b/i;
const CITE_RE=/\(\s*Miller\s+\d{1,4}(?:\s*[-–]\s*\d{1,4})?\s*\)/gi;
const INFORMAL=['gonna','wanna','gotta','kinda','sorta','kids','kid','okay','ok','yeah','yep','nope','guys','stuff'];
const CONTR_RES=[/\b[A-Za-z]+n['’]t\b/g,/\b(?:it|that|there|here|what|who|where|when|how|he|she|everyone|everybody|nobody|let)['’]s\b/gi,/\b[A-Za-z]+['’](?:re|ve|ll|d|m)\b/g,new RegExp('\\b(?:'+INFORMAL.join('|')+')\\b','gi')];
function contractions(t){const out=[];CONTR_RES.forEach(re=>{re.lastIndex=0;let m;while((m=re.exec(t)))out.push(m[0]);});return out;}
const countQ=t=>(t.match(/\?+(?=["'”’)\]]*(\s|$))/g)||[]).length;
const countCite=t=>(t.match(CITE_RE)||[]).length;
function paraTexts(slots){return PARAS.map(p=>slots.slice(p.from,p.from+p.n).map(s=>(s||'').trim()).filter(Boolean).join(' '));}
function fullText(slots){return paraTexts(slots).filter(Boolean).join('\n\n');}
function slotWarn(i,t){t=(t||'').trim();if(!t)return[];const w=[];const c=contractions(t);if(c.length)w.push('Kısaltma/gayriresmî: '+c.join(', '));
if([5,7,10,12,15,17].includes(i)&&!countCite(t))w.push('Kanıt slotu: "(Miller sayı)" yok');
if([8,13,18].includes(i)&&!/\?\s*["'”’)]*$/.test(t))w.push('Soru slotu "?" ile bitmeli');
if(i===22&&(t.match(/\bover\b/gi)||[]).length<3)w.push('Üçleme: 3× "over" bekleniyor');
if(i===3&&!thesisOk(t))w.push('Tez: "not guilty" + "because" + 3 sebep');
const P=PARAS.findIndex(p=>i>=p.from&&i<p.from+p.n);if(PARAS[P].from===i){if(P===0?!(P1_RE.test(t)||CONN_RE.test(t)):!CONN_RE.test(t))w.push(P===0?'P1 "Ladies and gentlemen" ile açılmalı':'Paragraf bağlaçla açılmalı (First, Moreover, Furthermore, Finally, Ultimately, Picture)');}
if(!w.length&&!matchTpl(SL[i].tpl,t))w.push('Kalıptan sapıyor (puanı etkilemez): '+tplText(SL[i].tpl));
return w;}
function analyze(slots){const full=fullText(slots);const paras=paraTexts(slots).map((t,P)=>{const ok=!!t&&(P===0?(P1_RE.test(t)||CONN_RE.test(t)):CONN_RE.test(t));return{ok,empty:!t,first:t.split(/\s+/)[0]||''};});
return{full,words:full.split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w)).length,cites:countCite(full),q:countQ(full),contr:contractions(full),paras,paraFail:paras.filter(p=>!p.ok).length,missing:slots.map((s,i)=>(s||'').trim()?-1:i).filter(i=>i>=0),overs:((slots[22]||'').match(/\bover\b/gi)||[]).length};}
function scoreOf(slots,chk){const a=analyze(slots);const f=i=>!!(slots[i]||'').trim();
const ws=chk.whoSlot===''||chk.whoSlot==null?-1:+chk.whoSlot;
const K=[{t:`"(Miller n)" alıntı: ${a.cites} (en az 6)`,ok:a.cites>=6,pt:Math.min(a.cites,6),max:6},{t:'Öz-kontrol: hiçbir şey uydurmadım',ok:!!chk.noInv,pt:chk.noInv?4:0,max:4}];
const I=[{t:`Retorik soru ("?" ile biten cümle): ${a.q} (en az 3)`,ok:a.q>=3,pt:Math.min(a.q,3),max:3},
{t:'Kusur kabulü: slot 2 dolu + onay',ok:f(1)&&chk.conc,pt:f(1)&&chk.conc?2:0,max:2},
{t:`"Who gains" motive: ${ws>=0?'slot '+(ws+1):'slot seçilmedi'}${ws>=0&&!f(ws)?' (boş)':''} + onay`,ok:ws>=0&&f(ws)&&chk.who,pt:ws>=0&&f(ws)&&chk.who?3:0,max:3},
{t:'Üçleme: slot 23 dolu + onay',ok:f(22)&&chk.tri,pt:f(22)&&chk.tri?2:0,max:2}];
const D=[{t:`Kısaltma/gayriresmî: ${a.contr.length}${a.contr.length?' ('+a.contr.join(', ')+')':''} · her biri −1`,ok:!a.contr.length,pt:Math.max(0,5-a.contr.length),max:5},
{t:`Bağlaçla açılan paragraf: ${6-a.paraFail}/6 · her eksik −1`,ok:!a.paraFail,pt:Math.max(0,5-a.paraFail),max:5}];
const sum=x=>x.reduce((s,y)=>s+y.pt,0);const k=sum(K),i=sum(I),d=sum(D);return{a,parts:[['Kanıt',K,k],['İkna',I,i],['Dil',D,d]],total:k+i+d};}

function updRepeats(){const c=S.prova.cur;if(!c)return;const r=repeats(c.slots);for(let i=0;i<25;i++){const el=$(`[data-rp="${i}"]`);if(!el)continue;const x=r[i];el.innerHTML=x?x.map(y=>`Tekrar: "${esc(y.k)}…" açılışı slot ${[...new Set(y.o)].map(j=>j+1).join(', ')} ile aynı (puanı etkilemez; çeşitlendir)`).join('<br>'):'';}}
function autoGrow(t){t.style.height='auto';t.style.height=Math.max(44,t.scrollHeight+2)+'px';}
function updSlot(i){const c=S.prova.cur,el=$('#slot'+i);if(!el)return;const t=c.slots[i]||'';const w=slotWarn(i,t);el.classList.toggle('filled',!!t.trim());el.classList.toggle('warn',!!t.trim()&&w.some(x=>!x.startsWith('Kalıptan')));$(`[data-fl="${i}"]`).innerHTML=w.map(esc).join('<br>');}
let lastCtr={};
function updCounters(bump){const c=S.prova.cur,a=analyze(c.slots),filled=25-a.missing.length;updRepeats();
const items=[['words',a.words,'kelime · hedef ≈500',a.words>=420&&a.words<=650?'ok':(a.words>0?'warn':'')],['cites',a.cites+'/6','(Miller n) alıntı',a.cites>=6?'ok':'warn'],['q',a.q+'/3','retorik soru',a.q>=3?'ok':'warn'],['contr',a.contr.length,a.contr.length?'kısaltma: '+a.contr.slice(0,3).join(', ')+(a.contr.length>3?'…':''):'kısaltma yok',a.contr.length?'bad':'ok'],['paras',(6-a.paraFail)+'/6','bağlaçla açılan paragraf',a.paraFail?'warn':'ok'],['filled',filled+'/25','dolu slot',filled===25?'ok':'']];
$('#ctrs').innerHTML=items.map(([k,v,l,cl])=>`<div class="ctr ${cl} ${bump&&lastCtr[k]!==undefined&&lastCtr[k]!==String(v)?'bump':''}" data-ctr="${k}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
items.forEach(([k,v])=>lastCtr[k]=String(v));
const oh=$('#overHint');if(oh)oh.textContent=`Otomatik ipucu: slot 23'te ${a.overs}× "over"${a.overs>=3?' ✓':''}.`;}
function updProvaTimer(){const c=S.prova.cur;if(!c||!$('#pTime'))return;const el=provaEl(c),left=P80-el;$('#pTime').textContent=left>=0?fmt(left):'+'+fmt(-left);
const b=$('#pStart');b.innerHTML=!c.start?ICON.play.replace('<svg','<svg width="12" height="12"')+' 80 dk\'yı başlat':c.pausedAt?'Sürdür':'Duraklat';
const m=el/60000,ph=!c.start?-1:m<10?0:m<65?1:m<80?2:3;const bounds=[[0,10],[10,65],[65,80]];
$$('#phases .ph').forEach((d,k)=>{const [a,bb]=bounds[k];d.firstChild.style.width=Math.min(100,Math.max(0,(m-a)/(bb-a)*100))+'%';d.classList.toggle('cur',ph===k);});
const filled=c.slots.filter(s=>s.trim()).length;let txt;
if(ph<0)txt='Hazır olunca süreyi başlat. İlk 10 dk: tezi ve 6 sayfayı planla.';else if(ph===0)txt='Plan: tezini, 3 sebebi ve 6 sayfa numarasını yan panelden seç.';else if(ph===1){const exp=Math.min(25,Math.floor((m-10)/2.2)+1);txt=`Yaz: hedef slot ${exp} · sen ${filled}/25 doluyla ${filled>=exp?'tempodasın':'geridesin ('+(exp-filled)+' slot)'}.`;}else if(ph===2)txt='Kontrol: kısaltmaları sil, bağlaçları ve "(Miller n)" sayısını kontrol et, sonra puanla.';else txt='Süre doldu. Gerçek sınavda kalem bırakılır; şimdi puanla.';
if(c.pausedAt)txt='Duraklatıldı · '+txt;$('#pPhase').textContent=txt;
if(ph===3&&!c.timeUpToast){c.timeUpToast=1;save();toast('80 dakika doldu: konuşmayı puanla.');}}
function doScore(user){const P=S.prova,c=P.cur;const r=scoreOf(c.slots,c.chk);const ch=CH[CHI[c.id]];
if(user){c.result={total:r.total,at:Date.now()};P.history.push({id:c.id,score:r.total,at:Date.now()});if(P.history.length>30)P.history.shift();addXP(50+r.total*5);badge('prova');if(r.total===30){badge('perfect');confetti(80);}save();}
const missing=r.a.missing;const warns=[];c.slots.forEach((t,i)=>{slotWarn(i,t).forEach(w=>warns.push([i,w]));});const rp=repeats(c.slots);Object.keys(rp).forEach(i=>rp[i].forEach(y=>warns.push([+i,'Tekrar (puanı etkilemez): "'+y.k+'…" açılışı slot '+[...new Set(y.o)].map(j=>j+1).join(', ')+' ile aynı'])));
$('#result').innerHTML=`<div class="card" id="resCard"><div class="score"><div class="scorebig">${r.total}<small>/30</small></div><div><div class="eyebrow">Formül puanı · ${esc(ch.name)}</div><h3 class="h2">${r.total===30?'Kusursuz formül. Mahkeme ayakta.':r.total>=24?'Güçlü savunma; birkaç vida eksik.':'Formül eksik: aşağıdaki maddeleri tamamla.'}</h3><p class="small muted" style="margin:4px 0 0">${r.a.words} kelime · ${25-missing.length}/25 slot dolu. Not: bu puan formülün sayılabilir kısmını ölçer; içerik kalitesini Claude'a ya da öğretmenine sor.</p></div></div>
<div class="parts">${r.parts.map(([name,items,pts])=>`<div class="part" data-part="${name}"><h4>${name} <b>${pts}/10</b></h4><ul>${items.map(x=>`<li><span class="${x.ok?'yes':'no'}">${x.ok?'✓':'✗'}</span><span>${esc(x.t)}</span><span class="pt">${x.pt}/${x.max}</span></li>`).join('')}</ul></div>`).join('')}</div>
<hr class="rule"><b>Eksik slotlar</b> ${missing.length?`<div class="row" style="margin-top:6px;gap:6px">${missing.map(i=>`<button class="chip bad" data-jump="${i}">Slot ${i+1} · ${esc(SL[i].task)}</button>`).join('')}</div>`:'<span class="chip ok">yok, 25/25</span>'}
${warns.length?`<div style="margin-top:10px"><b>Slot uyarıları</b><ul class="rules">${warns.map(([i,w])=>`<li><button class="chip ${w.startsWith('Kalıptan')?'':'warn'}" data-jump="${i}">Slot ${i+1}</button> ${esc(w)}</li>`).join('')}</ul></div>`:''}
<hr class="rule"><div class="row"><b>Konuşmanın tam metni</b><span class="sp"></span><button class="btn sm pri" id="copyBtn">Metni kopyala</button></div><p class="tiny muted" style="margin:2px 0 6px">Claude'a yapıştırıp rubriğe göre puanlatabilirsin. Metin sadece senin panona kopyalanır.</p>
<textarea id="fullOut" readonly rows="10" style="font-size:14px">${esc(r.a.full)}</textarea></div>`;
$('#copyBtn').onclick=()=>copyText($('#fullOut').value);
if(user)$('#resCard').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});}
function copyText(t){const done=()=>toast('Metin panoya kopyalandı.');const fb=()=>{const ta=$('#fullOut');ta.focus();ta.select();try{document.execCommand('copy');done();}catch(e){toast('Kopyalanamadı: metni seçip elle kopyala.');}};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb();}

/* ============ SABAH KARTI ============ */
RENDER.kart=function(){ensureAll();
$('#v-kart').innerHTML=`<div class="row noprint"><div><div class="eyebrow">Mod 5 · sabah 10 dk</div><h2 class="h2">Sabah kartı</h2></div><div class="sp"></div><button class="btn pri" id="printBtn">Yazdır</button></div>
<p class="small muted noprint" style="margin:4px 0 0">Tek sayfa (A4): formülün 25 slotu, 11 tez cümlen ve her karakterin KENDİ kitabındaki sayfa numaraları (PDF sayfaları değil). Sınava götürme kuralını öğretmenine göre kontrol et; bu kart sabah okumak için.</p>
<div class="sheet" id="card"><h1>Sabah kartı · The Crucible savunması</h1><div class="sub">Sayfalar: kendi kitabım · 6 paragraf · 25 cümle · ≈500 kelime · 80 dk: 0–10 plan, 10–65 yaz (≈2 dk/cümle), 65–80 kontrol · she/he karaktere göre</div>
<div class="cf">${PARAS.map((p,P)=>`<div class="pb"><h3>P${P+1} ${p.t}</h3>${SL.slice(p.from,p.from+p.n).map(s=>`<div><i>${s.n}</i>${tplHTML(s.tpl)}</div>`).join('')}</div>`).join('')}</div>
<div class="rl" style="margin-bottom:2px;border-bottom:0"><b>${esc(MNEMO)}</b></div><div class="rl" style="margin-top:0;border-top:0"><b>30 puan:</b> ≥6 <span class="mono">(Miller n)</span> + uydurma yok · ≥3 "?" + kusur kabulü + who gains + üçleme · 0 kısaltma (n't, it's, gonna, kids) · paragraflar: Ladies and gentlemen / First / Moreover / Finally / Picture / Ultimately</div>
<div class="ct">${CHO.map(c=>{const z=S.tez[c.id];const own=z&&thesisOk(z.thesis);const th=own?z.thesis.trim():readyTh(c.id);if(z)prepZ(c,z);const pv=e=>z?String(z.pg[e.find]||'').trim():'';const pg=[0,1,2].map(k=>{const evs=argEv(c,k);let ps=evs.map(pv).filter(Boolean);if(!ps.length)ps=evs.filter(e=>e.bookPage!=null).map(e=>'≈'+e.bookPage);return `A${k+1}: ${ps.length?ps.join(', '):'—'}`;}).concat(extraEv(c).map(e=>{const v=pv(e);return v?`${e.arg==='pathos'?'Pathos':e.arg==='dikkat'?'Dikkat':'Ek'}: ${v}`:'';}).filter(Boolean)).join(' · ');return `<div class="cc"><b>${esc(c.name)}</b>${tezProg(c.id).ready?' ✓':''}<div class="th ${th?'':'empty'}">${th?esc(th)+(own?'':' <i class="empty">(hazır)</i>'):'tez yok'}</div><div class="pp">${esc(pg)}</div></div>`;}).join('')}</div></div>`;
$('#printBtn').onclick=()=>{S.plan.printed=true;save();window.print();};
};

/* ============ ROZETLER ============ */
RENDER.rozet=function(){const l=lvl(S.xp),rc=readyCount();
$('#v-rozet').innerHTML=`<div class="row"><div><div class="eyebrow">Mod 6</div><h2 class="h2">XP ve rozetler</h2></div></div>
<div class="card" style="margin-top:12px"><div class="row"><div class="scorebig" style="font-size:60px">${S.xp}<small> XP</small></div><div class="sp"><b>${esc(l.name)}</b><div class="bar" style="margin-top:6px"><i style="width:${Math.round(l.pct*100)}%"></i></div><div class="tiny muted" style="margin-top:4px">Rütbeler: ${LEVELS.map(x=>x[1]+' '+x[0]).join(' · ')}</div></div></div>
<div class="tiny muted" style="margin-top:8px">XP: formül aşama 1/2/3 doğru +5/+10/+15 (tekrar sonrası +3) · tez +20, her kanıt +5, Dava hazır +50 · quiz doğru +5, tur +15 · mola +10 · prova +50 + puan×5.</div></div>
<h3 class="ptitle">Dava hazır · ${rc}/11</h3><div class="badges">${CH.map(c=>`<div class="badge case ${tezProg(c.id).ready?'got':''}"><div class="ic">${esc(c.short[0])}</div><b>${esc(c.short)}</b><span>${tezProg(c.id).ready?'Dava hazır':'hazır değil'}</span></div>`).join('')}</div>
<h3 class="ptitle">Rozetler</h3><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?'got':''}"><div class="ic">${esc(b.i)}</div><b>${esc(b.t)}</b><span>${esc(b.d)}</span></div>`).join('')}</div>
<div class="row" style="margin-top:14px">${rc===11?'<button class="btn pri" id="finBtn">Final ekranını aç</button>':''}</div>
<div class="card" style="margin-top:16px"><b>Sıfırlama</b><p class="small muted" style="margin:2px 0 8px">Her şey yalnızca bu tarayıcıda (localStorage) durur; hiçbir veri dışarı gönderilmez.</p><div class="row">
<button class="btn sm danger" data-reset="formula">Formül</button><button class="btn sm danger" data-reset="tez">Tez fabrikası</button><button class="btn sm danger" data-reset="quiz">Quiz</button><button class="btn sm danger" data-reset="prova">Prova</button><button class="btn sm danger" data-reset="plan">Gece sayacı</button><button class="btn sm danger" data-reset="xp">XP ve rozetler</button><button class="btn sm danger" data-reset="all">Hepsini sıfırla</button></div></div>`;
const fb=$('#finBtn');if(fb)fb.onclick=showFinal;
$$('[data-reset]').forEach(b=>b.onclick=()=>{const k=b.dataset.reset;if(!confirm(k==='all'?'HER ŞEY silinsin mi? Bu geri alınamaz.':'Bu bölüm sıfırlansın mı?'))return;const d=def();
if(k==='all'){S=d;}else if(k==='tez'){S.tez={};S.tezSel=null;S.tezTimer=null;}else if(k==='xp'){S.xp=0;S.badges={};S.finalShown=false;}else if(k==='plan'){S.plan=d.plan;S.mola=d.mola;}else S[k]=d[k];
save(true);updXP();updNight();RENDER.rozet();toast('Sıfırlandı.');});};

function showFinal(){const best=S.prova.history.reduce((m,h)=>Math.max(m,h.score),0);
overlay(`<div class="gavel" style="width:80px;margin:0 auto" id="finGavel">${ICON.gavel}</div><div class="eyebrow" style="margin-top:8px">Final · 11/11</div><h2 class="h1" style="font-size:40px">Mahkeme ertelendi.<br>Bütün davalar hazır.</h2>
<p class="muted">11 tez, 66 sayfa numaralı kanıt. ${S.xp} XP · ${esc(lvl(S.xp).name)} · altın slot ${goldCount()}/25${best?' · en iyi prova '+best+'/30':''}.</p>
<p class="small">Şimdi: sabah kartını yazdır, bir tam prova daha yap, sonra uyu. Yarın kitap açık; formül kafanda.</p>
<div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" data-close data-goto="kart">Sabah kartı</button><button class="btn" data-close data-goto="prova">Tam prova</button><button class="btn ghost" data-close>Kapat</button></div>`);
confetti(120);setTimeout(()=>strike($('#finGavel .gavel')),200);}

/* ============ tick & boot ============ */
setInterval(()=>{updNight();if(S.view==='formul')updBreak();else if(S.view==='mola')updMola();else if(S.view==='prova')updProvaTimer();else if(S.view==='tez')updTezTimer();},1000);
function setTopH(){document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px');}
addEventListener('resize',setTopH);
ensureAll();recheckReady();buildPlanbar();updThemeBtn();updXP();updNight();setTopH();
if(!storageOK)$('#storagewarn').hidden=false;
const h=location.hash.slice(1),hm=h.match(/^formul\/(\d{1,2})$/);if(hm){go('formul',true);jumpTo(+hm[1]-1);}else go(RENDER[h]?h:(S.view||'plan'),true);
addEventListener('hashchange',()=>{const v=location.hash.slice(1),m=v.match(/^formul\/(\d{1,2})$/);if(m){jumpTo(+m[1]-1);return;}if(RENDER[v]&&v!==S.view)go(v);});
window.CRUCIBLE={get S(){return S;},pickTez,analyze,scoreOf,matchTpl,SL,CH};
})();
</script>
