<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konuşma Notları — Bir Fikrin Otopsisi</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root { --ink: #16161A; --ink-2: #5B5B63; --line: #E3E1DC; --accent: #0E8F73; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF9F6; color: var(--ink); font-family: Inter, Helvetica, Arial, sans-serif; padding: 48px 56px 80px; max-width: 980px; margin: 0 auto; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 28px; }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
  .sub { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .14em; color: var(--ink-2); text-transform: uppercase; margin-top: 8px; }
  .help { font-size: 14px; color: var(--ink-2); margin-top: 12px; line-height: 1.5; }
  h2 { font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .16em; color: var(--accent); margin: 34px 0 6px; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: 54px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); break-inside: avoid; }
  .n { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--ink-2); padding-top: 3px; }
  .t { font-weight: 700; font-size: 17px; }
  .t span { font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 11px; letter-spacing: .1em; color: var(--ink-2); margin-left: 10px; text-transform: uppercase; }
  .no { font-size: 15px; line-height: 1.55; color: #2A2A30; margin-top: 4px; }
  .who { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--accent); margin-left: 10px; }
  @media print { body { background: #fff; padding: 0; } .help { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Bir Fikrin Otopsisi — Konuşma Notları</h1>
  <div class="sub" id="sub"></div>
  <p class="help"><b>Süre sınırı: video hariç 10 dakika.</b> Bu sayfa provalar içindir; yazdırmak için ⌘P / Ctrl+P. Notlar <b>js/content.js</b> içindeki <b>notes</b> alanlarından otomatik gelir. Sunum sırasında aynı notları <b>P</b> tuşuyla açılan sunucu penceresinde de görebilirsiniz.</p>
</header>
<main id="list"></main>

<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/fx.js"></script>
<script src="js/scenes.js"></script>
<script>
(function () {
  var CFG = window.CONFIG, C = window.CONTENT;
  document.getElementById("sub").textContent = CFG.group + " · " + CFG.members.join(" · ");
  var names = { "final": "FİNAL" };
  C.index.rows.forEach(function (r) { names[r.n] = "DOSYA " + r.n + " — " + r.t; });
  var html = "", cur = "§", vis = 0;
  window.SCENES.forEach(function (d) {
    var g = d.file == null ? (d.hidden ? "EKLER · GİZLİ EKRANLAR" : "AÇILIŞ") : (names[d.file] || d.file);
    if (g !== cur) {
      cur = g;
      var who = d.file && CFG.showPresenters && CFG.presenters[d.file] ? '<span class="who">' + CFG.presenters[d.file] + "</span>" : "";
      var tk = d.file == null ? (d.hidden ? null : "intro") : d.file;
      var tgt = tk && CFG.timing && CFG.timing[tk] ? '<span class="who" style="color:#9A6A00">⏱ bitiş hedefi ' + CFG.timing[tk] + "</span>" : "";
      var col = d.file && CFG.fileColors && CFG.fileColors[d.file] ? ' style="color:' + CFG.fileColors[d.file] + ';filter:brightness(.75)"' : "";
      html += "<h2" + col + ">" + g + who + tgt + "</h2>";
    }
    var num = d.hidden ? "··" : String(++vis).padStart(2, "0");
    html += '<div class="row"><div class="n">' + num + '</div><div><div class="t">' + d.title +
      "<span>" + (d.steps > 1 ? d.steps + " adım" : "tek ekran") + '</span></div><div class="no">' + (d.notes || "") + "</div></div></div>";
  });
  document.getElementById("list").innerHTML = html;
})();
</script>
</body>
</html>
